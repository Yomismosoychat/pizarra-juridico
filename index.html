<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pizarra Juridico</title>
<style>
:root {
  --bg: #f0f2f5; --card: #ffffff; --text: #1a1a2e; --text2: #6b7280; --border: #e5e7eb;
  --shadow: 0 1px 3px rgba(0,0,0,.06);
  --urgent: #dc2626; --alta: #ea580c; --normal: #d97706; --seguim: #2563eb; --esperar: #16a34a;
  --step-yellow: #fef3c7; --step-yellow-border: #f59e0b;
  --step-red: #fee2e2; --step-red-border: #dc2626;
  --step-green: #dcfce7; --step-green-border: #16a34a;
  --cat-civil: #6FA8DC; --cat-social: #6aa84f; --cat-penal: #cc4125;
  --cat-contadmin: #e69138; --cat-expediente: #8e7cc3; --cat-cgpj: #ea9999;
  --cat-tc: #ff9900; --cat-tributario: #76a5af; --cat-rpatrimonial: #c27ba0;
  --cat-familia: #d5a6bd; --cat-pendiente: #999; --cat-decanato: #ffb74d;
  font-family: 'Sora', system-ui, -apple-system, sans-serif;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1117; --card:#1a1d27; --text:#e8e8ee; --text2:#9ca3af; --border:#2a2d3a;
  --shadow:0 1px 3px rgba(0,0,0,.3);
  --step-yellow:#422006; --step-yellow-border:#b45309;
  --step-red:#450a0a; --step-red-border:#b91c1c;
  --step-green:#052e16; --step-green-border:#15803d;
}}
:root[data-theme="dark"]{
  --bg:#0f1117; --card:#1a1d27; --text:#e8e8ee; --text2:#9ca3af; --border:#2a2d3a;
  --shadow:0 1px 3px rgba(0,0,0,.3);
  --step-yellow:#422006; --step-yellow-border:#b45309;
  --step-red:#450a0a; --step-red-border:#b91c1c;
  --step-green:#052e16; --step-green-border:#15803d;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-size:13px;line-height:1.5;padding:0}

/* ═══ TOP BAR ═══ */
.topbar{background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:100}
.topbar h1{font-size:18px;font-weight:700;letter-spacing:-.3px}
.topbar-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.stats{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;margin-top:8px}
.stat{background:rgba(255,255,255,.12);border-radius:6px;padding:4px 10px;display:flex;align-items:center;gap:5px}
.stat .n{font-weight:700;font-size:16px}
.stat-gastos{background:rgba(239,68,68,.25);border:1px solid rgba(239,68,68,.4);cursor:pointer;position:relative}
.stat-gastos:hover{background:rgba(239,68,68,.35)}
.stat-tiempo{background:rgba(59,130,246,.2);border:1px solid rgba(59,130,246,.35)}

/* ═══ FINANCIAL STACK (right side) ═══ */
.topbar-content{display:flex;align-items:flex-start;gap:12px;margin-top:8px}
.stats-left{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;flex:1}
.financial-stack{display:flex;flex-direction:column;gap:4px;min-width:140px;align-items:flex-end}
.fin-row{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border-radius:6px;padding:5px 12px;font-size:12px;width:100%;justify-content:space-between}
.fin-row .fin-label{font-size:10px;text-transform:uppercase;letter-spacing:.3px;opacity:.8;white-space:nowrap}
.fin-row .fin-val{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.fin-row.fin-juego{border-left:3px solid #f59e0b}
.fin-row.fin-juego .fin-val{color:#fbbf24}
.fin-row.fin-gastos{border-left:3px solid #ef4444;cursor:pointer}
.fin-row.fin-gastos:hover{background:rgba(239,68,68,.2)}
.fin-row.fin-gastos .fin-val{color:#f87171}
.fin-row.fin-ganado{border-left:3px solid #22c55e}
.fin-row.fin-ganado .fin-val{color:#4ade80}
@media(max-width:600px){
  .topbar-content{flex-direction:column}
  .financial-stack{flex-direction:row;width:100%;min-width:0}
  .fin-row{flex:1;min-width:0;flex-direction:column;gap:2px;padding:4px 8px;text-align:center}
}

/* ═══ GASTOS PANEL ═══ */
.gastos-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;justify-content:center;align-items:flex-start;padding:40px 16px;overflow-y:auto}
.gastos-panel{background:var(--card);border-radius:12px;max-width:720px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--border);animation:slideUp .25s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.gastos-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);background:linear-gradient(135deg,#1a1a2e,#16213e);border-radius:12px 12px 0 0;color:#fff}
.gastos-header h2{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.gastos-close{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;padding:4px 8px;border-radius:6px}
.gastos-close:hover{background:rgba(255,255,255,.15)}
.gastos-total-bar{display:flex;flex-wrap:wrap;gap:12px;padding:16px 20px;background:rgba(239,68,68,.06);border-bottom:1px solid var(--border)}
.gastos-total-item{text-align:center;flex:1;min-width:100px}
.gastos-total-item .gt-val{font-size:22px;font-weight:800;color:var(--urgent)}
.gastos-total-item .gt-label{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.gastos-section{padding:12px 20px;border-bottom:1px solid var(--border)}
.gastos-section:last-child{border-bottom:none}
.gastos-section-title{font-size:13px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.gastos-section-title:hover{color:#2563eb}
.gastos-row{display:flex;justify-content:space-between;align-items:center;padding:3px 0;font-size:12px;border-bottom:1px solid rgba(0,0,0,.04)}
.gastos-row:last-child{border-bottom:none}
.gastos-row .gr-label{color:var(--text2);flex:1}
.gastos-row .gr-val{font-weight:700;font-variant-numeric:tabular-nums}
.gastos-row .gr-est{color:var(--text2);font-style:italic;font-size:11px}
.gastos-row.gr-total{border-top:2px solid var(--border);padding-top:6px;margin-top:4px;font-weight:700;font-size:13px}
.gastos-month{display:grid;grid-template-columns:90px 1fr auto;gap:4px;align-items:center;padding:2px 0;font-size:11px}
.gastos-month .gm-date{color:var(--text2);font-variant-numeric:tabular-nums}
.gastos-month .gm-desc{font-size:10px;color:var(--text2)}
.gastos-month .gm-amt{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.gastos-month.gm-estimated{opacity:.65;font-style:italic}
.gastos-badge-est{display:inline-block;background:rgba(234,179,8,.2);color:#ca8a04;font-size:9px;padding:1px 5px;border-radius:4px;font-weight:600;margin-left:4px}
.gastos-badge-conf{display:inline-block;background:rgba(34,197,94,.15);color:#16a34a;font-size:9px;padding:1px 5px;border-radius:4px;font-weight:600;margin-left:4px}
.gastos-tiempo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;padding:4px 0}
.gastos-tiempo-card{text-align:center;background:var(--bg);border-radius:8px;padding:10px 8px;border:1px solid var(--border)}
.gastos-tiempo-card .gtc-val{font-size:20px;font-weight:800;color:#2563eb}
.gastos-tiempo-card .gtc-label{font-size:10px;color:var(--text2);text-transform:uppercase;margin-top:2px}

/* ═══ CONTROLS ═══ */
.controls{display:flex;gap:6px;padding:8px 16px;align-items:center;flex-wrap:wrap;position:sticky;top:68px;background:var(--bg);z-index:90;border-bottom:1px solid var(--border)}
.btn{border:none;border-radius:6px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
.btn-active{background:#2563eb;color:#fff}
.btn-inactive{background:var(--card);color:var(--text);border:1px solid var(--border)}
.btn-inactive:hover{background:rgba(37,99,235,.06)}
.search{flex:1;min-width:120px;max-width:280px;padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;font-family:inherit;background:var(--card);color:var(--text)}

/* ═══ CATEGORY HEADERS ═══ */
.cat-header{display:flex;align-items:center;gap:8px;padding:8px 16px;cursor:pointer;user-select:none;border-bottom:1px solid var(--border);background:var(--card)}
.cat-header:hover{filter:brightness(.97)}
.cat-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.cat-label{font-weight:700;font-size:13px;flex:1}
.cat-count{font-size:11px;color:var(--text2);background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:1px 8px}
.cat-arrow{font-size:14px;color:var(--text2);transition:.2s}
.cat-header.collapsed .cat-arrow{transform:rotate(-90deg)}

/* ═══ CASE CARDS (VISIBLE MODE) ═══ */
.case-card{background:var(--card);border-bottom:1px solid var(--border);padding:10px 16px;transition:.1s}
.case-card:hover{background:rgba(37,99,235,.02)}
.case-card.urgency-red{border-left:4px solid var(--urgent)}
.case-card.urgency-yellow{border-left:4px solid var(--normal)}
.case-card.urgency-green{border-left:4px solid var(--esperar)}

/* Row 1: Main info */
.cc-row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prio-sel{border:none;border-radius:4px;padding:2px;font-size:12px;font-weight:700;cursor:pointer;background:transparent;width:50px;font-family:inherit;color:var(--text)}
.cc-name{font-weight:700;font-size:13px;cursor:pointer;flex-shrink:0}
.cc-ref{font-size:11px;color:var(--text2);margin-left:4px}
.cc-court{font-size:11px;color:var(--text2);margin-left:auto;text-align:right;max-width:200px}
.cc-amount{font-size:12px;font-weight:700;color:var(--alta);margin-left:8px;white-space:nowrap}
.trial-badge{display:inline-block;font-size:10px;font-weight:700;background:#16a34a;color:#fff;border-radius:3px;padding:1px 5px;margin-left:6px}
.pill{display:inline-block;font-size:9px;font-weight:700;text-transform:uppercase;border-radius:3px;padding:1px 6px;color:#fff;margin-left:6px}
.pill-curso{background:#2563eb}.pill-juicio{background:#16a34a}.pill-pendiente{background:#9ca3af}.pill-cerrado{background:#6b7280}
.cat-badge{display:inline-block;font-size:9px;font-weight:700;color:#fff;border-radius:3px;padding:1px 5px;margin-right:4px}

/* Row 2: Current action - ALWAYS VISIBLE */
.cc-row2{margin-top:4px;font-size:12px;line-height:1.4;padding-left:54px}
.cc-row2.urgent{color:var(--urgent);font-weight:600}

/* Row 3: Step bar - ALWAYS VISIBLE */
.cc-row3{margin-top:6px;padding-left:54px;display:flex;gap:3px;flex-wrap:wrap;align-items:center}
.step-chip{font-size:10px;padding:2px 6px;border-radius:3px;border:1px solid;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:default;line-height:1.3}
.step-chip.sc-yellow{background:var(--step-yellow);border-color:var(--step-yellow-border);color:var(--text)}
.step-chip.sc-red{background:var(--step-red);border-color:var(--step-red-border);color:var(--text)}
.step-chip.sc-green{background:var(--step-green);border-color:var(--step-green-border);color:var(--text)}
.step-chip.sc-default{background:var(--bg);border-color:var(--border);color:var(--text2)}
.step-more{font-size:10px;color:var(--text2);cursor:pointer;text-decoration:underline}

/* Row 4: buttons */
.cc-actions{margin-top:6px;padding-left:54px;display:flex;gap:6px;align-items:center}
.btn-hecho{background:#16a34a;color:#fff;border:none;border-radius:5px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s}
.btn-hecho:hover{background:#15803d;transform:scale(1.04)}
.btn-expand{background:transparent;color:var(--text2);border:1px solid var(--border);border-radius:5px;padding:4px 8px;font-size:10px;cursor:pointer;font-family:inherit}
.btn-expand:hover{background:var(--bg)}

/* ═══ EXPANDED DETAIL ═══ */
.case-detail{display:none;padding:8px 16px 12px 70px;background:var(--card);border-bottom:2px solid var(--border)}
.case-detail.open{display:block}
@media(max-width:600px){.case-detail{padding:8px 10px}}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:11px}
.detail-grid dt{color:var(--text2);font-weight:600}.detail-grid dd{font-weight:500}
.steps-title{font-weight:700;font-size:12px;margin:8px 0 4px;color:var(--text2)}
.step-item{display:flex;gap:6px;padding:3px 0;font-size:11px;border-left:2px solid var(--border);margin-left:4px;padding-left:10px}
.step-date{color:var(--seguim);font-weight:600;min-width:65px;flex-shrink:0}
.step-text{color:var(--text)}

/* ═══ HECHO FORM ═══ */
.hecho-form{margin-top:10px;padding:12px;background:rgba(22,163,74,.06);border:1px solid rgba(22,163,74,.2);border-radius:6px}
.hecho-form label{display:block;font-size:11px;font-weight:600;margin-bottom:3px;color:var(--text2)}
.hecho-form textarea{width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:5px;font-family:inherit;font-size:12px;resize:vertical;min-height:40px;background:var(--card);color:var(--text)}
.radio-group{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.radio-opt{cursor:pointer;border:2px solid var(--border);border-radius:6px;padding:4px 10px;font-size:11px;font-weight:600;transition:.15s;background:var(--card);color:var(--text)}
.radio-opt:hover,.radio-opt.selected{border-color:#2563eb;background:rgba(37,99,235,.06)}
.hecho-form input[type=date],.hecho-form input[type=text]{padding:5px 8px;border:1px solid var(--border);border-radius:5px;font-family:inherit;font-size:12px;margin-top:3px;background:var(--card);color:var(--text);width:100%}
.btn-save{background:#16a34a;color:#fff;border:none;border-radius:6px;padding:8px 20px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:8px}
.btn-save:hover{background:#15803d}
.btn-cancel{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px 16px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:8px;margin-left:6px}

/* ═══ TABLA VIEW ═══ */
.tabla-wrap{overflow-x:auto;padding:0 8px}
.tabla{width:100%;border-collapse:collapse;font-size:11px}
.tabla th{background:var(--card);position:sticky;top:120px;z-index:10;padding:6px 8px;text-align:left;font-weight:700;border-bottom:2px solid var(--border);color:var(--text2);font-size:10px;text-transform:uppercase;white-space:nowrap}
.tabla td{padding:5px 8px;border-bottom:1px solid var(--border);vertical-align:top}
.tabla tr:hover td{background:rgba(37,99,235,.03)}
.tabla .td-name{font-weight:600;min-width:140px;max-width:200px}
.tabla .td-current{min-width:200px;max-width:350px;font-size:11px;line-height:1.3}
.tabla .td-steps{min-width:250px}

/* ═══ RECLAMACIÓN SECTION ═══ */
.reclam-header{padding:16px;background:var(--card);margin:8px;border-radius:8px;border:1px solid var(--border)}
.reclam-total{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-bottom:16px}
.reclam-big{font-size:32px;font-weight:700;color:var(--urgent);letter-spacing:-.5px}
.reclam-ganado-big{font-size:24px;font-weight:700;color:var(--esperar)}
.reclam-neto{font-size:18px;font-weight:600;color:var(--seguim)}
.reclam-label{font-size:10px;font-weight:600;text-transform:uppercase;color:var(--text2);display:block}
.reclam-table{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px}
.reclam-table th{background:var(--bg);padding:6px 8px;text-align:left;font-weight:700;border-bottom:2px solid var(--border);color:var(--text2);font-size:10px;text-transform:uppercase}
.reclam-table td{padding:5px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
.reclam-table tr:hover td{background:rgba(37,99,235,.03)}
.reclam-input{width:90px;padding:3px 6px;border:1px solid var(--border);border-radius:4px;font-family:inherit;font-size:12px;text-align:right;background:var(--card);color:var(--text)}
.reclam-cat-row td{background:var(--bg);font-weight:700;font-size:12px}
.reclam-subtotal{font-weight:700;color:var(--alta)}
.reclam-won{color:var(--esperar);font-weight:700}
.reclam-sync-btn{background:var(--seguim);color:#fff;border:none;border-radius:6px;padding:6px 14px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;margin-left:auto}
.reclam-sync-btn:hover{opacity:.85}
.reclam-sync-status{font-size:10px;color:var(--text2);margin-left:8px}
.nuevo-caso-btn{background:var(--ok,#4caf50);color:#fff;border:none;border-radius:6px;padding:6px 14px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;margin-left:4px;white-space:nowrap}
.nuevo-caso-btn:hover{opacity:.85}

/* ═══ MODAL NUEVO CASO ═══ */
#nc-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9000;align-items:center;justify-content:center}
#nc-overlay.open{display:flex}
#nc-modal{background:var(--card,#1e1e2e);border:1px solid var(--border,#333);border-radius:12px;padding:24px 28px;width:min(520px,96vw);max-height:90vh;overflow-y:auto;position:relative;color:var(--text,#eee)}
#nc-modal h2{margin:0 0 16px;font-size:15px;font-weight:700;letter-spacing:.02em}
.nc-field{margin-bottom:12px}
.nc-field label{display:block;font-size:11px;font-weight:600;color:var(--text2,#aaa);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.nc-field input,.nc-field select,.nc-field textarea{width:100%;box-sizing:border-box;background:var(--bg,#111);border:1px solid var(--border,#333);border-radius:6px;color:var(--text,#eee);font-family:inherit;font-size:13px;padding:7px 10px}
.nc-field textarea{resize:vertical;min-height:60px}
.nc-field input:focus,.nc-field select:focus,.nc-field textarea:focus{outline:2px solid var(--seguim,#7c6af5);border-color:transparent}
.nc-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#nc-result{margin-top:12px;font-size:12px;padding:8px 10px;border-radius:6px;display:none}
#nc-result.ok{background:rgba(76,175,80,.15);border:1px solid var(--ok,#4caf50);color:var(--ok,#4caf50)}
#nc-result.err{background:rgba(229,57,53,.15);border:1px solid var(--urgent,#e53935);color:var(--urgent,#e53935)}
.nc-btns{display:flex;gap:10px;margin-top:16px;justify-content:flex-end}
.nc-btn-cancel{background:transparent;border:1px solid var(--border,#333);color:var(--text2,#aaa);border-radius:6px;padding:7px 18px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.nc-btn-submit{background:var(--ok,#4caf50);color:#fff;border:none;border-radius:6px;padding:7px 20px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.nc-btn-submit:disabled{opacity:.5;cursor:not-allowed}
#nc-close{position:absolute;top:12px;right:16px;background:none;border:none;color:var(--text2,#aaa);font-size:18px;cursor:pointer;line-height:1}

/* ═══ JUICIOS VIEW ═══ */
.juicios-wrap{padding:8px}
.juicio-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:10px;position:relative;overflow:hidden}
.juicio-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
.juicio-card.jc-inminente::before{background:var(--urgent)}
.juicio-card.jc-proximo::before{background:var(--alta)}
.juicio-card.jc-lejano::before{background:var(--esperar)}
.juicio-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.juicio-fecha{font-size:22px;font-weight:700;letter-spacing:-.3px}
.juicio-dias{font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px;white-space:nowrap}
.jd-inminente{background:rgba(220,38,38,.12);color:var(--urgent)}
.jd-proximo{background:rgba(234,88,12,.12);color:var(--alta)}
.jd-lejano{background:rgba(22,163,74,.1);color:var(--esperar)}
.juicio-caso{font-size:14px;font-weight:600;margin:6px 0 2px;color:var(--text)}
.juicio-meta{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:4px 16px;font-size:11px;margin:8px 0}
.juicio-meta dt{color:var(--text2);font-weight:600}

/* ═══ TOAST ═══ */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:#1a1a2e;color:#fff;padding:10px 20px;border-radius:8px;font-weight:600;font-size:13px;z-index:9999;transition:.3s;opacity:0;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* ═══ RESPONSIVE ═══ */
@media(max-width:700px){
  .cc-court{display:none}
  .cc-row2,.cc-row3,.cc-actions{padding-left:0}
  .step-chip{max-width:160px}
  .controls{padding:6px 10px}
  .topbar{padding:10px 12px}
  .case-card{padding:8px 10px}
  .detail-grid{grid-template-columns:1fr}
}
@media(max-width:480px){
  .cc-ref{display:none}
  .stats{gap:4px}
  .stat{padding:3px 6px;font-size:11px}

}

  familia:     {label:"FAMILIA",            color:"#d5a6bd"},
  expediente:  {label:"EXPEDIENTES",        color:"#8e7cc3"},

const CAT_ORDER = ["civil","social","penal","contadmin","familia","expediente","cgpj","tc","tributario","rpatrimonial","pendiente","decanato"];

let STATE, expanded = {}, hechoOpen = null, collapsed = {};

function loadState(){
  try { STATE = JSON.parse(document.getElementById("app-state").textContent); }
  catch(e){ STATE = {v:11, saved:"", view:"groups", cases:[], log:[]}; }
}

function today(){ return new Date().toISOString().slice(0,10); }

function fmtDate(iso){
  if(!iso) return "\u2014";
  const d = new Date(iso);
  return d.toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit",year:"2-digit"});
}

function daysUntil(iso){
  if(!iso) return Infinity;
  return Math.ceil((new Date(iso) - new Date()) / 86400000);
}

function isUrgentText(t){ return /urgente|averiguar|pendiente pedir|desaparecida|nos ignora/i.test(t); }

// ═══ GASTOS ═══
let gastosOpen = false;
let gastosSectionOpen = {};

function calcTotalGastos(){
  const g = STATE.gastos; if(!g) return 0;
  let t = 0;
  for(const k of Object.keys(g.ia||{})){
    t += g.ia[k].estimated || g.ia[k].confirmed || 0;
  }
  t += (g.depositos||{}).total || 0;
  t += (g.impresion||{}).total || 0;
  return Math.round(t);
}

function calcTiempo(){
  const g = STATE.gastos; if(!g||!g.tiempo) return {days:0,hours:0};
  const start = new Date(g.tiempo.startDate);
  const now = new Date();
  const days = Math.floor((now - start) / 86400000);
  const hours = days * g.tiempo.minHoursPerDay;
  return {days, hours, workDays: Math.round(hours/8)};
}

function toggleGastos(){ gastosOpen = !gastosOpen; renderGastosPanel(); }

function toggleGastosSection(id){ gastosSectionOpen[id] = !gastosSectionOpen[id]; renderGastosPanel(); }

function renderGastosPanel(){
  let existing = document.getElementById('gastos-overlay');
  if(!gastosOpen){ if(existing) existing.remove(); return; }

  const g = STATE.gastos; if(!g) return;
  const fmt = (n) => n.toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2}) + "€";
  const fmtInt = (n) => n.toLocaleString("es-ES",{minimumFractionDigits:0,maximumFractionDigits:0}) + "€";
  const t = calcTiempo();

  // Calculate totals
  let totalIA = 0, totalIAConf = 0;
  for(const k of Object.keys(g.ia||{})){
    totalIA += g.ia[k].estimated || g.ia[k].confirmed || 0;
    totalIAConf += g.ia[k].confirmed || 0;
  }
  const totalDep = (g.depositos||{}).total || 0;
  const totalImp = (g.impresion||{}).total || 0;
  const grandTotal = totalIA + totalDep + totalImp;

  let h = '<div class="gastos-overlay" id="gastos-overlay" onclick="if(event.target===this){toggleGastos()}">';
  h += '<div class="gastos-panel">';

  // Header
  h += '<div class="gastos-header"><h2>\u{1F4B8} CONTROL DE GASTOS</h2>';
  h += '<button class="gastos-close" onclick="toggleGastos()">✕</button></div>';

  // Total bar
  h += '<div class="gastos-total-bar">';
  h += '<div class="gastos-total-item"><div class="gt-val">' + fmtInt(Math.round(grandTotal)) + '</div><div class="gt-label">Total invertido</div></div>';
  h += '<div class="gastos-total-item"><div class="gt-val" style="color:#2563eb">' + t.days + '</div><div class="gt-label">Días dedicados</div></div>';
  h += '<div class="gastos-total-item"><div class="gt-val" style="color:#2563eb">' + t.hours.toLocaleString("es-ES") + '</div><div class="gt-label">Horas (mín. 5h/día)</div></div>';
  h += '<div class="gastos-total-item"><div class="gt-val" style="color:#7c3aed">' + fmtInt(Math.round(totalIAConf)) + '</div><div class="gt-label">Confirmado Gmail</div></div>';
  h += '</div>';

  // IA section
  h += '<div class="gastos-section">';
  h += '<div class="gastos-section-title" onclick="toggleGastosSection(\'ia\')"><span>' + (gastosSectionOpen.ia?'▼':'▶') + '</span>🤖 Suscripciones IA + Conectividad — ' + fmtInt(Math.round(totalIA)) + '</div>';
  if(gastosSectionOpen.ia){
    for(const [k, svc] of Object.entries(g.ia)){
      const est = svc.estimated || svc.confirmed || 0;
      const conf = svc.confirmed || 0;
      h += '<div class="gastos-row"><span class="gr-label">' + esc(svc.label) + '</span>';
      h += '<span class="gr-val">' + fmt(est) + '</span>';
      h += conf > 0 ? '<span class="gastos-badge-conf">✓ ' + fmt(conf) + ' conf.</span>' : '<span class="gastos-badge-est">sin recibos</span>';
      h += '</div>';
      // Monthly detail toggle
      if(svc.months && svc.months.length > 0){
        h += '<div style="padding-left:12px;margin-bottom:6px">';
        h += '<div class="gastos-section-title" style="font-size:11px;margin-bottom:4px" onclick="toggleGastosSection(\'ia-'+k+'\')"><span style="font-size:9px">' + (gastosSectionOpen['ia-'+k]?'▼':'▶') + '</span> Detalle mensual</div>';
        if(gastosSectionOpen['ia-'+k]){
          for(const m of svc.months){
            const cls = m.type==='estimated'?'gm-estimated':'';
            h += '<div class="gastos-month '+cls+'">';
            h += '<span class="gm-date">' + m.m + '</span>';
            h += '<span class="gm-desc">' + esc(m.desc) + '</span>';
            h += '<span class="gm-amt">' + fmt(m.amt) + '</span>';
            h += '</div>';
          }
        }
        h += '</div>';
      }
      if(svc.note){
        h += '<div style="font-size:10px;color:var(--text2);padding-left:12px;margin-bottom:4px;font-style:italic">' + esc(svc.note) + '</div>';
      }
    }
    h += '<div class="gastos-row gr-total"><span class="gr-label">TOTAL IA + CONECTIVIDAD</span><span class="gr-val" style="color:var(--urgent)">' + fmtInt(Math.round(totalIA)) + '</span></div>';
  }
  h += '</div>';

  // Deposits section
  h += '<div class="gastos-section">';
  h += '<div class="gastos-section-title" onclick="toggleGastosSection(\'dep\')"><span>' + (gastosSectionOpen.dep?'▼':'▶') + '</span>🏦 ' + esc(g.depositos.label) + ' — ' + fmtInt(totalDep) + '</div>';
  if(gastosSectionOpen.dep){
    for(const d of g.depositos.detail){
      h += '<div class="gastos-row"><span class="gr-label">' + esc(d.desc) + ' <span style="font-size:10px;color:var(--text2)">(' + esc(d.date) + ')</span></span><span class="gr-val">25,00€</span></div>';
    }
    h += '<div class="gastos-row gr-total"><span class="gr-label">TOTAL DEPÓSITOS (' + g.depositos.count + ' × 25€)</span><span class="gr-val">' + fmtInt(totalDep) + '</span></div>';
    if(g.depositos.note){
      h += '<div style="font-size:10px;color:var(--text2);font-style:italic;margin-top:4px">⚠️ ' + esc(g.depositos.note) + '</div>';
    }
  }
  h += '</div>';

  // Printing section
  h += '<div class="gastos-section">';
  h += '<div class="gastos-section-title" onclick="toggleGastosSection(\'imp\')"><span>' + (gastosSectionOpen.imp?'▼':'▶') + '</span>🖨️ ' + esc(g.impresion.label) + ' — ' + fmtInt(totalImp) + '</div>';
  if(gastosSectionOpen.imp){
    const br = g.impresion.breakdown;
    const copies = g.impresion.copies || 2;
    for(const [k, v] of Object.entries(br)){
      const labels = {decanato:'Decanato',juzgadoGuardia:'Juzgado de Guardia',registroEntrada:'Registro de Entrada',fiscalia:'Fiscalía',otros:'Otros destinos'};
      const folios = v.pagesEst * copies;
      h += '<div class="gastos-row"><span class="gr-label">' + (labels[k]||k) + ' (' + v.escritos + ' escritos × ~' + Math.round(v.pagesEst/v.escritos) + ' pág × ' + copies + ' copias)</span><span class="gr-val">' + folios + ' folios → ' + fmt(folios*0.10) + '</span></div>';
    }
    const totalFolios = g.impresion.pages * copies;
    h += '<div class="gastos-row gr-total"><span class="gr-label">TOTAL IMPRESIÓN (' + g.impresion.pages.toLocaleString("es-ES") + ' pág × ' + copies + ' copias = ' + totalFolios.toLocaleString("es-ES") + ' folios)</span><span class="gr-val">' + fmtInt(totalImp) + '</span></div>';
    if(g.impresion.note){
      h += '<div style="font-size:10px;color:var(--text2);font-style:italic;margin-top:4px">ℹ️ ' + esc(g.impresion.note) + '</div>';
    }
  }
  h += '</div>';

  // Time section
  h += '<div class="gastos-section">';
  h += '<div class="gastos-section-title" onclick="toggleGastosSection(\'time\')"><span>' + (gastosSectionOpen.time?'▼':'▶') + '</span>⏱️ Tiempo dedicado — desde ' + g.tiempo.startDate + '</div>';
  if(gastosSectionOpen.time){
    h += '<div class="gastos-tiempo-grid">';
    h += '<div class="gastos-tiempo-card"><div class="gtc-val">' + t.days + '</div><div class="gtc-label">Días naturales</div></div>';
    h += '<div class="gastos-tiempo-card"><div class="gtc-val">' + t.hours.toLocaleString("es-ES") + '</div><div class="gtc-label">Horas totales</div></div>';
    h += '<div class="gastos-tiempo-card"><div class="gtc-val">' + t.workDays + '</div><div class="gtc-label">Jornadas de 8h</div></div>';
    h += '<div class="gastos-tiempo-card"><div class="gtc-val">' + Math.round(t.days/30) + '</div><div class="gtc-label">Meses</div></div>';
    h += '</div>';
    h += '<div style="font-size:10px;color:var(--text2);margin-top:8px;font-style:italic">📊 Cálculo basado en mínimo ' + g.tiempo.minHoursPerDay + 'h/día de dedicación media desde agosto 2025. Uso real potencialmente mayor.</div>';
  }
  h += '</div>';

  // Footer
  h += '<div style="padding:10px 20px;font-size:10px;color:var(--text2);border-top:1px solid var(--border);display:flex;justify-content:space-between">';
  h += '<span>Última actualización: ' + g.lastUpdated + '</span>';
  h += '<span>Datos de Gmail · Los valores <i>estimados</i> se basan en importes conocidos de meses confirmados</span>';
  h += '</div>';

  h += '</div></div>';

  if(existing){ existing.outerHTML = h; }
  else { document.body.insertAdjacentHTML('beforeend', h); }
}

// ═══ RENDER ═══
function render(){
  const app = document.getElementById("app");
  const view = STATE.view || "groups";
  const filter = (document.getElementById("searchBox")||{}).value || "";

  let cases = STATE.cases.filter(c => {
    if(!filter) return true;
    const q = filter.toLowerCase();
    return c.name.toLowerCase().includes(q) || c.ref.toLowerCase().includes(q) ||
           c.current.toLowerCase().includes(q) || (c.court||"").toLowerCase().includes(q) ||
           (CATS[c.cat]||{}).label?.toLowerCase().includes(q);
  });

  const urgent = cases.filter(c=>c.priority===1).length;
  const withTrial = cases.filter(c=>c.trial).length;
  const actuar = cases.filter(c=>c.nextType==="actuar").length;
  const totalAmount = cases.reduce((s,c)=>s+(c.amount||0),0);
  const totalGanadoHeader = cases.reduce((s,c)=>s+(c.ganado||0),0);
  const fmtFull = (n) => n.toLocaleString("es-ES",{minimumFractionDigits:0,maximumFractionDigits:0}) + "\u20AC";

  let h = `<div class="topbar"><div class="topbar-row"><h1>\u2696\uFE0F Pizarra Juridico</h1></div>
    <div class="topbar-content">
      <div class="stats-left">
        <div class="stat"><span>\u{1F534}</span><span class="n">${urgent}</span> Urgente</div>
        <div class="stat"><span>\u{1F4A5}</span><span class="n">${actuar}</span> Actuar</div>
        <div class="stat"><span>\u2696\ufe0f</span><span class="n">${withTrial}</span> Juicios</div>
        <div class="stat"><span>\u{1F4CB}</span><span class="n">${cases.length}</span> Total</div>
        <div class="stat"><span>\u{1F4E8}</span><span class="n" style="color:${(STATE.comms||[]).filter(c=>c._alert).length>0?'var(--urgent)':'var(--text2)'}">${(STATE.comms||[]).filter(c=>!c.responded).length}</span> Pend.</div>
        <div class="stat stat-tiempo"><span>\u23f1\ufe0f</span><span class="n" style="color:#60a5fa">${calcTiempo().days}d</span> \u00b7 ${calcTiempo().hours}h</div>
      </div>
      <div class="financial-stack">
        <div class="fin-row fin-juego"><span class="fin-label">\u{1F4B0} En juego</span><span class="fin-val">${fmtFull(totalAmount)}</span></div>
        <div class="fin-row fin-gastos" onclick="toggleGastos()" title="Ver desglose de gastos"><span class="fin-label">\u{1F4B8} Gastado</span><span class="fin-val">${fmtFull(calcTotalGastos())}</span></div>
        <div class="fin-row fin-ganado"><span class="fin-label">\u2705 Ganado</span><span class="fin-val">${fmtFull(totalGanadoHeader)}</span></div>
      </div>
    </div></div>`;

  h += `<div class="controls">
    <button class="btn ${view==="groups"?"btn-active":"btn-inactive"}" onclick="setView('groups')">\u{1F4CB} Grupos</button>
    <button class="btn ${view==="priority"?"btn-active":"btn-inactive"}" onclick="setView('priority')">\u{1F53A} Prioridad</button>
    <button class="btn ${view==="tabla"?"btn-active":"btn-inactive"}" onclick="setView('tabla')">\u{1F4CA} Tabla</button>
    <button class="btn ${view==="reclamacion"?"btn-active":"btn-inactive"}" onclick="setView('reclamacion')">\u{1F4B0} Reclamación</button>
    <button class="btn ${view==="juicios"?"btn-active":"btn-inactive"}" onclick="setView('juicios')">⚖️ Juicios</button>
    <button class="btn ${view==="seguimiento"?"btn-active":"btn-inactive"}" onclick="setView('seguimiento')">📨 Seguimiento</button>
    <input class="search" id="searchBox" type="text" placeholder="\u{1F50D} Buscar..." value="${esc(filter)}" oninput="render()">
    <span class="reclam-sync-status" id="sync-status" style="margin-left:auto"></span>
    <button class="reclam-sync-btn" onclick="syncToSheets()">\u{1F4E4} Sync Sheet</button>
    <button class="reclam-sync-btn" onclick="loadFromSheet()" style="margin-left:4px">\u{2B07}\u{FE0F} Load Sheet</button>
    <button class="nuevo-caso-btn" onclick="openNuevoCaso()" id="btn-nuevo-caso">+ Nuevo caso</button>
  </div>
  <div id="sheet-diag" style="font-size:11px;padding:3px 12px 4px;line-height:1.5;word-break:break-all;background:var(--bg2,rgba(255,255,255,.06))"></div>`;

  // Forense banner (when pending)
  if(!STATE.forenseReady){
    const forenseCount = STATE.cases.filter(c=>c.needsForense).length;
    if(forenseCount > 0){
      h += `<div class="forense-banner">
        <div class="fb-icon">\u{1F52C}</div>
        <div class="fb-info">
          <div class="fb-title">INFORME FORENSE PENDIENTE</div>
          <div class="fb-sub">${forenseCount} casos (social + P1) en espera hasta que se aporte el informe pericial forense</div>
        </div>
        <div class="fb-count">${forenseCount}<small>en espera</small></div>
        <button class="btn-forense" onclick="activateForense()">\u{1F4E5} APORTAR INFORME FORENSE</button>
      </div>`;
    }
  }

  if(view === "groups") h += renderGrouped(cases);
  else if(view === "priority") h += renderPriority(cases);
  else if(view === "tabla") h += renderTabla(cases);
  else if(view === "reclamacion") h += renderReclamacion(cases);
  else if(view === "juicios") h += renderJuicios(cases);
  else if(view === "seguimiento") h += renderSeguimiento();

  app.innerHTML = h;
}

function renderGrouped(cases){
  let h = "";
  for(const cat of CAT_ORDER){
    const cc = cases.filter(c=>c.cat===cat);
    if(!cc.length) continue;
    const info = CATS[cat];
    const isColl = collapsed[cat] !== false;
    const tCount = cc.filter(c=>c.trial).length;
    h += `<div class="cat-header ${isColl?"collapsed":""}" onclick="toggleCat('${cat}')">
      <div class="cat-dot" style="background:${info.color}"></div>
      <span class="cat-label">${info.label}</span>
      ${tCount?`<span class="cat-count">\u2696\uFE0F ${tCount}</span>`:""}
      <span class="cat-count">${cc.length}</span>
      <span class="cat-arrow">\u25BC</span>
    </div>`;
    if(!isColl) for(const c of cc) h += renderCard(c, false);
  }
  return h;
}

function renderPriority(cases){
  let sorted = [...cases].sort((a,b)=>{
    if(a.priority !== b.priority) return a.priority - b.priority;
    const da = a.nextDate || a.trial || "9999";
    const db = b.nextDate || b.trial || "9999";
    return da.localeCompare(db);
  });
  let h = "";
  for(const c of sorted) h += renderCard(c, true);
  return h;
}

function renderCard(c, showCat){
  const prioEmoji = PRIO_LABELS[c.priority] || "\u{1F7E1}";
  const isUrg = c.priority === 1 || isUrgentText(c.current);
  const catInfo = CATS[c.cat] || {label:"?",color:"#999"};
  const urgClass = c.urgency==="red"?"urgency-red":c.urgency==="yellow"?"urgency-yellow":c.urgency==="green"?"urgency-green":"";
  const statusCls = c.status==="juicio"?"pill-juicio":c.status==="pendiente"?"pill-pendiente":c.status==="cerrado"?"pill-cerrado":"pill-curso";

  let dateStr = "";
  if(c.trial){
    const d = daysUntil(c.trial);
    dateStr = `<span class="trial-badge">\u2696\uFE0F ${fmtDate(c.trial)} (${d>0?d+"d":"HOY"})</span>`;
  } else if(c.nextDate){
    dateStr = `<span style="font-size:11px;color:var(--text2);margin-left:6px">\u{1F4C5} ${fmtDate(c.nextDate)}</span>`;
  }

  // ROW 1: prio + name + ref + court + amount + status + date
  let h = `<div class="case-card ${urgClass}" style="border-left-color:${catInfo.color}">
    <div class="cc-row1">
      <select class="prio-sel" onchange="changePrio('${c.id}',+this.value)" title="${PRIO_NAMES[c.priority]}">
        ${[1,2,3,4,5].map(p=>`<option value="${p}" ${p===c.priority?"selected":""}>${PRIO_LABELS[p]} ${p}</option>`).join("")}
      </select>`;
  if(showCat) h += `<span class="cat-badge" style="background:${catInfo.color}">${catInfo.label}</span>`;
  h += `<span class="cc-name" onclick="toggleExpand('${c.id}')">${esc(c.name)}</span>
      <span class="cc-ref">${esc(c.ref)}</span>
      <span class="pill ${statusCls}">${esc(c.status)}</span>
      ${c.needsForense && !STATE.forenseReady ? '<span class="forense-chip">\u{1F52C} FORENSE</span>' : ''}
      ${dateStr}
      ${c.amount?`<span class="cc-amount">${c.amount.toLocaleString("es-ES")}\u20AC</span>`:""}
      <span class="cc-court">${esc(c.court||"")}</span>
    </div>`;

  // ROW 2: Current action - ALWAYS VISIBLE
  h += `<div class="cc-row2 ${isUrg?"urgent":""}">${esc(c.current)}</div>`;

  // ROW 3: Step chips from Excel data - ALWAYS VISIBLE
  const exSteps = c.exSteps || [];
  if(exSteps.length > 0){
    h += `<div class="cc-row3">`;
    const show = exSteps.slice(-5);
    for(const s of show){
      const cls = s.c==="yellow"?"sc-yellow":s.c==="red"?"sc-red":s.c==="green"?"sc-green":"sc-default";
      h += `<span class="step-chip ${cls}" title="${esc(s.t)}">${esc(s.t)}</span>`;
    }
    if(exSteps.length > 5) h += `<span class="step-more" onclick="toggleExpand('${c.id}')">+${exSteps.length-5} m\u00E1s</span>`;
    h += `</div>`;
  }

  // ROW 4: Actions
  h += `<div class="cc-actions">
    <button class="btn-hecho" onclick="startHecho('${c.id}')">\u2705 HECHO</button>
    <button class="btn-expand" onclick="toggleExpand('${c.id}')">${expanded[c.id]?"\u25B2 Cerrar":"\u25BC Detalle"}</button>
    ${c.dias?`<span style="font-size:10px;color:var(--text2)">\u23F3 ${esc(c.dias)}</span>`:""}
  </div>`;

  // EXPANDED DETAIL
  h += `<div class="case-detail ${expanded[c.id]?"open":""}" id="detail-${c.id}">
    <div class="detail-grid">
      <dt>Juzgado</dt><dd>${esc(c.court||"\u2014")}</dd>
      <dt>Referencia</dt><dd>${esc(c.ref)}</dd>
      <dt>Cuant\u00EDa</dt><dd>${c.amount ? c.amount.toLocaleString("es-ES")+"\u20AC" : "\u2014"}</dd>
      <dt>Estado</dt><dd>${esc(c.status)}</dd>
      ${c.trial?`<dt>Juicio</dt><dd><strong>${fmtDate(c.trial)}</strong> (${daysUntil(c.trial)}d)</dd>`:""}
      ${c.nextDate?`<dt>Pr\u00F3x. fecha</dt><dd>${fmtDate(c.nextDate)}</dd>`:""}
    </div>`;

  // All Excel steps with full text
  if(exSteps.length > 0){
    h += `<div class="steps-title">\u{1F4C4} PASOS EXCEL (${exSteps.length})</div>`;
    for(let i=0;i<exSteps.length;i++){
      const s = exSteps[i];
      const cls = s.c==="yellow"?"sc-yellow":s.c==="red"?"sc-red":s.c==="green"?"sc-green":"sc-default";
      h += `<div class="step-item"><span class="step-date" style="min-width:30px">P${i+1}</span><span class="step-chip ${cls}" style="max-width:none;white-space:normal">${esc(s.t)}</span></div>`;
    }
  }

  // v10 step history
  if(c.steps && c.steps.length){
    h += `<div class="steps-title">\u{1F4DC} HISTORIAL (${c.steps.length})</div>`;
    for(let i=0;i<c.steps.length;i++){
      const s = c.steps[i];
      h += `<div class="step-item"><span class="step-date">${esc(s.d)}</span><span class="step-text">${i+1}. ${esc(s.t)}</span></div>`;
    }
  }

  if(c.steps.length===0 && exSteps.length===0){
    h += `<div style="font-size:11px;color:var(--text2);padding:4px 0 4px 16px">Sin pasos registrados a\u00FAn</div>`;
  }

  if(hechoOpen===c.id) h += renderHechoForm(c);

  h += `</div></div>`;
  return h;
}

// ═══ JUICIOS VIEW ═══
function renderJuicios(cases){
  const allCases = STATE.cases;
  const trialCases = allCases.filter(c => c.trial);
  trialCases.sort((a,b) => new Date(a.trial) - new Date(b.trial));

  if(!trialCases.length) return `<div class="juicio-empty">⚖️ No hay juicios señalados actualmente</div>`;

  const fmtEuro = (n) => n.toLocaleString("es-ES",{minimumFractionDigits:0,maximumFractionDigits:0}) + "€";
  const hoy = new Date();

  let h = `<div class="juicios-wrap">`;
  h += `<div style="padding:8px 4px 12px;font-size:13px;color:var(--text2);font-weight:600">⚖️ ${trialCases.length} juicios señalados — ordenados por fecha</div>`;

  for(const c of trialCases){
    const trialDate = new Date(c.trial);
    const dias = Math.ceil((trialDate - hoy) / 86400000);
    const fechaStr = trialDate.toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
    const info = CATS[c.cat] || {label:"?",color:"#999"};

    let cardCls, diasCls, diasLabel;
    if(dias <= 60){
      cardCls = "jc-inminente"; diasCls = "jd-inminente";
      diasLabel = dias <= 0 ? "HOY / PASADO" : dias + " días";
    } else if(dias <= 180){
      cardCls = "jc-proximo"; diasCls = "jd-proximo";
      diasLabel = dias + " días";
    } else {
      cardCls = "jc-lejano"; diasCls = "jd-lejano";
      diasLabel = dias + " días";
    }

    // Readiness check
    const pendientes = [];
    const exSteps = c.exSteps || [];
    const allSteps = [...(c.steps||[]).map(s=>s.t), ...exSteps.map(s=>s.t)];
    const allText = allSteps.join(" ").toLowerCase() + " " + (c.current||"").toLowerCase();

    if(/pendiente|falta|presentar nueva|pedir|averiguar|buscar estado/i.test(c.current)){
      pendientes.push(c.current);
    }
    for(const s of exSteps){
      if(s.c === "red" && !/en curso/i.test(s.t)){
        const already = pendientes.some(p => p === s.t);
        if(!already) pendientes.push(s.t);
      }
    }
    if(/pedir abogado|esperando abogado|solicitado abogado oficio/i.test(allText) && !/asignado/i.test(allText)){
      const exists = pendientes.some(p => /abogado/i.test(p));
      if(!exists) pendientes.push("Pendiente designación abogado de oficio");
    }

    const isReady = pendientes.length === 0;

    h += `<div class="juicio-card ${cardCls}">`;
    h += `<div class="juicio-top">`;
    h += `<div><div class="juicio-fecha">${fechaStr.charAt(0).toUpperCase() + fechaStr.slice(1)}</div>`;
    h += `<div class="juicio-caso"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${info.color};margin-right:6px;vertical-align:middle"></span>${esc(c.name)}</div></div>`;
    h += `<div class="juicio-dias ${diasCls}">${diasLabel}</div>`;
    h += `</div>`;

    h += `<dl class="juicio-meta">`;
    h += `<dt>Juzgado</dt><dd>${esc(c.court||"—")}</dd>`;
    h += `<dt>Referencia</dt><dd>${esc(c.ref||"—")}</dd>`;
    h += `<dt>Jurisdicción</dt><dd><span style="background:${info.color}22;color:${info.color};padding:2px 8px;border-radius:4px;font-weight:700;font-size:10px">${info.label}</span></dd>`;
    h += `<dt>Cuantía</dt><dd style="font-weight:700;color:var(--alta)">${c.amount ? fmtEuro(c.amount) : "—"}</dd>`;
    h += `<dt>Prioridad</dt><dd>${PRIO_LABELS[c.priority]||""} ${PRIO_NAMES[c.priority]||""}</dd>`;
    h += `<dt>Estado actual</dt><dd>${esc(c.current||"—")}</dd>`;
    h += `</dl>`;

    if(isReady){
      h += `<div class="juicio-ready ready-ok">✅ LISTO — Documentación al día. Sin tareas pendientes detectadas.</div>`;
    } else {
      h += `<div class="juicio-ready ready-warn">⚠️ PENDIENTE — Falta preparación:`;
      h += `<ul>`;
      for(const p of pendientes) h += `<li>${esc(p)}</li>`;
      h += `</ul></div>`;
    }

    const lastSteps = (c.steps||[]).slice(-3);
    if(lastSteps.length){
      h += `<div style="margin-top:8px;font-size:10px;color:var(--text2);font-weight:600">Últimos movimientos:</div>`;
      for(const s of lastSteps){
        h += `<div style="font-size:11px;padding:2px 0;border-left:2px solid var(--border);margin-left:4px;padding-left:10px"><span style="color:var(--seguim);font-weight:600;margin-right:6px">${esc(s.d)}</span>${esc(s.t)}</div>`;
      }
    }

    h += `</div>`;
  }

  h += `</div>`;
  return h;
}

let selectedNextType = {};

function setView(v){ if(v==='groups') collapsed = {}; STATE.view = v; render(); scheduleSave(); }
function toggleCat(cat){ collapsed[cat] = collapsed[cat] === false ? true : false; render(); }
function toggleExpand(id){ expanded[id] = !expanded[id]; render(); }

function changePrio(id, val){

function startHecho(id){
  expanded[id] = true;
  hechoOpen = id;

  render();
  const el = document.getElementById("hecho-form-"+id);
  if(el) el.scrollIntoView({behavior:"smooth",block:"center"});

function cancelHecho(){ hechoOpen = null; render(); }

function selectNextType(id, type, el){
  selectedNextType[id] = type;
  document.querySelectorAll("#next-type-"+id+" .radio-opt").forEach(o=>o.classList.remove("selected"));
  el.classList.add("selected");
  const extra = document.getElementById("next-extra-"+id);
  if(type==="actuar"){
    extra.innerHTML = `<label style="margin-top:6px">Fecha:</label><input type="date" id="next-date-${id}">
      <label style="margin-top:4px">\u00BFQu\u00E9 hacer?</label><input type="text" id="next-what-${id}" placeholder="Pr\u00F3xima acci\u00F3n...">`;
  } else if(type==="seguimiento"){
    extra.innerHTML = `<label style="margin-top:6px">\u00BFQu\u00E9 seguir?</label><input type="text" id="next-what-${id}" placeholder="Seguimiento...">`;
  } else if(type==="esperar"){
    extra.innerHTML = `<label style="margin-top:6px">\u00BFEsperar de qui\u00E9n?</label><input type="text" id="next-what-${id}" placeholder="Organismo, juzgado...">`;
  } else {
    extra.innerHTML = `<p style="font-size:12px;color:var(--esperar);font-weight:600;margin-top:6px">Caso CERRADO.</p>`;
  }
}

function saveHecho(id){
  const c = STATE.cases.find(x=>x.id===id);
  if(!c) return;
  const textEl = document.getElementById("hecho-text-"+id);
  const done = textEl ? textEl.value.trim() : c.current;
  const ntype = selectedNextType[id];
  if(!ntype){ showToast("\u26A0\uFE0F Selecciona el siguiente paso"); return; }

  const d = new Date();
  const dateStr = d.toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit",year:"2-digit"});
  c.steps.push({d: dateStr, t: done});

  const whatEl = document.getElementById("next-what-"+id);
  const dateEl = document.getElementById("next-date-"+id);

  if(ntype==="actuar"){
    c.nextType = "actuar"; c.nextDate = dateEl ? dateEl.value : null;
    c.current = whatEl ? whatEl.value.trim() || "Actuar en fecha" : "Actuar en fecha";
    c.priority = 1;
  } else if(ntype==="seguimiento"){
    c.nextType = "seguimiento"; c.nextDate = null;
    c.current = whatEl ? whatEl.value.trim() || "Hacer seguimiento" : "Hacer seguimiento";
    c.priority = 2;
  } else if(ntype==="esperar"){
    c.nextType = "esperar"; c.nextDate = null;
    c.current = "Esperar respuesta" + (whatEl && whatEl.value.trim() ? ": " + whatEl.value.trim() : "");
    c.priority = 4;
  } else {
    c.status = "cerrado"; c.nextType = "cerrado";
    c.current = "CASO CERRADO \u2014 " + dateStr;
    c.priority = 5;
  }

  STATE.log.push({date:d.toISOString(), case:c.id, action:"hecho", text:done, next:ntype});
  STATE.saved = today();
  hechoOpen = null; selectedNextType[id] = null;
  render(); scheduleSave();
  showToast("\u2705 Registrado como HECHO");
}


// ═══ SEGUIMIENTO VIEW ═══
let segSubView = 'emails';
let segFilter = {institution:'all', status:'all', search:''};

// Migrate old 'registro' → 'escrito'/'reg'; also fix escrito→reg for REGAGE entries
function migrateComms(){
  const comms = STATE.comms || [];
  for(const c of comms){
    const regMatch = String(c.subj||'').match(/REGAGE\w+/i);
    if(c.method === 'registro' || (c.method === 'escrito' && regMatch)){
      if(regMatch){
        c.method = 'reg';
        if(!c.regNum) c.regNum = regMatch[0];
      } else if(c.method === 'registro'){
        c.method = 'escrito';
      }
    }
  }
}

function parseCommDate(d){
  if(!d) return null;
  let dt;
  if(d.includes('-')) dt = new Date(d);
  else {
    const parts = d.split(/[\/\.]/);
    if(parts.length >= 3){
      let yr = parseInt(parts[2]);
      if(yr < 100) yr += 2000;
      dt = new Date(yr, parseInt(parts[1])-1, parseInt(parts[0]));
    } else return null;
  }
  return (dt && !isNaN(dt.getTime())) ? dt : null;
}

function calcCommAlerts(){
  const comms = STATE.comms || [];
  const hoy = new Date();
  for(const c of comms){
    if(c.responded){ c._alert = false; c._daysSince = undefined; continue; }
    const dt = parseCommDate(c.d);
    if(!dt){ c._alert = false; c._daysSince = undefined; continue; }
    const daysSince = Math.floor((hoy - dt) / 86400000);
    const threshold = c.method === 'email' ? 4 : c.method === 'reg' ? 30 : 15;
    c._alert = daysSince >= threshold;
    c._daysSince = daysSince;
    c._threshold = threshold;
  }
}

function gmailSearchUrl(to, subj){
  let q = '';
  if(to) q += 'to:' + to + ' ';
  if(subj) q += 'subject:"' + subj.replace(/"/g,'') + '"';
  return 'https://mail.google.com/mail/u/0/#search/' + encodeURIComponent(q.trim());
}

function getFilteredComms(methodFilter){
  const comms = STATE.comms || [];
  let filtered = comms.filter(c => c.method === methodFilter);
  if(segFilter.institution !== 'all') filtered = filtered.filter(c => (c.toLabel||'').includes(segFilter.institution));
  if(segFilter.status === 'alert') filtered = filtered.filter(c => c._alert);
  else if(segFilter.status === 'pending') filtered = filtered.filter(c => !c.responded);
  else if(segFilter.status === 'responded') filtered = filtered.filter(c => c.responded);
  if(segFilter.search){
    const q = segFilter.search.toLowerCase();
    filtered = filtered.filter(c => (c.subj||'').toLowerCase().includes(q) || (c.toLabel||'').toLowerCase().includes(q) || (c.to||'').toLowerCase().includes(q) || (c.caseName||'').toLowerCase().includes(q));
  }
  filtered.sort((a,b) => {
    if(a._alert && !b._alert) return -1;
    if(!a._alert && b._alert) return 1;
    if(a.responded && !b.responded) return 1;
    if(!a.responded && b.responded) return -1;
    return (b.d||'').localeCompare(a.d||'');
  });
  return filtered;
}

function renderSeguimiento(){
  migrateComms();
  calcCommAlerts();
  const comms = STATE.comms || [];
  const sv = segSubView;

  // Counts per tab
  const emailAll = comms.filter(c=>c.method==='email');
  const escritoAll = comms.filter(c=>c.method==='escrito');
  const regAll = comms.filter(c=>c.method==='reg');
  const emailPend = emailAll.filter(c=>!c.responded && c._alert).length;
  const escritoPend = escritoAll.filter(c=>!c.responded && c._alert).length;
  const regPend = regAll.filter(c=>!c.responded && c._alert).length;

  let h = '<div class="seg-wrap">';

  // Sub-tabs
  h += '<div class="seg-subtabs">';
  h += '<button class="seg-subtab ' + (sv==='emails'?'active':'') + '" onclick="segSubView=\'emails\';segFilter={institution:\'all\',status:\'all\',search:\'\'};render()">\u{1F4E7} Emails' + (emailPend>0?' <span class="seg-tab-count">'+emailPend+'</span>':'') + '</button>';
  h += '<button class="seg-subtab ' + (sv==='escritos'?'active':'') + '" onclick="segSubView=\'escritos\';segFilter={institution:\'all\',status:\'all\',search:\'\'};render()">\u{1F4DD} Escritos' + (escritoPend>0?' <span class="seg-tab-count">'+escritoPend+'</span>':'') + '</button>';

// ─── ACTIONS ───
function markRespondedById(commId, via){
  const comms = STATE.comms || [];
  const c = comms.find(x => x.id === commId);
  if(!c) return;
  c.responded = true;
  c.respondedDate = new Date().toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'2-digit'});
  c.respondedVia = via || null;
  render(); scheduleSave();
  showToast('✅ Marcado como contestado vía ' + (via||''));
}

function reopenComm(commId){
  const comms = STATE.comms || [];
  const c = comms.find(x => x.id === commId);
  if(!c) return;
  c.responded = false;
  c.respondedDate = null;
  c.respondedVia = null;
  render(); scheduleSave();
  showToast('↩️ Reabierto');
}

function addSegEntry(method){
  const dateEl = document.getElementById('seg-add-date');
  const toEl = document.getElementById('seg-add-to');
  const toLabelEl = document.getElementById('seg-add-tolabel');
  const subjEl = document.getElementById('seg-add-subj');
  const caseEl = document.getElementById('seg-add-case');
  const regNumEl = document.getElementById('seg-add-regnum');

  const d = dateEl ? dateEl.value : today();
  const subj = subjEl ? subjEl.value.trim() : '';
  if(!subj){ showToast('⚠️ Escribe un asunto'); return; }

  if(!STATE.comms) STATE.comms = [];
  const newComm = {
    id: method.slice(0,3) + '-' + Date.now() + '-' + Math.floor(Math.random()*9999),
    d: d,
    to: toEl ? toEl.value.trim() : '',
    toLabel: toLabelEl ? toLabelEl.value.trim() : '',
    subj: subj,
    method: method,
    responded: false,
    respondedDate: null,
    respondedVia: null,
    caseId: caseEl ? caseEl.value.trim() : '',
    caseName: ''
  };
  if(method === 'reg' && regNumEl) newComm.regNum = regNumEl.value.trim();

  // Try to find case name from caseId
  if(newComm.caseId){
    const found = STATE.cases.find(c => c.id === newComm.caseId);
    if(found) newComm.caseName = found.name;
  }

  STATE.comms.unshift(newComm);
  render(); scheduleSave();
  showToast('✅ Añadido ' + (method==='email'?'email':method==='escrito'?'escrito':'REG'));
}

}

function closeForenseModal(){
  const m = document.getElementById('forense-modal');
  if(m) m.remove();
}

function confirmForense(){
  closeForenseModal();
  STATE.forenseReady = true;
  const dateStr = new Date().toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit",year:"2-digit"});
  const alertCourts = [];

  for(const c of STATE.cases){
    if(c.needsForense){
      // Restore previous status
      c.status = c.preForenseStatus || 'curso';
      // Update urgency based on priority
      if(c.priority <= 1) c.urgency = 'red';
      else if(c.priority <= 3) c.urgency = 'yellow';
      else c.urgency = 'green';
      // Log the forense activation
      c.steps.push({d: dateStr, t: 'INFORME FORENSE APORTADO — Pendiente redactar escrito: no hay vista y resolución sin juicio'});
      c.current = '⚠️ REDACTAR ESCRITO: solicitar no hay vista y resolución sin juicio';
      c.nextType = 'actuar';
      alertCourts.push(c.name + ' — ' + (c.court||''));
    }
  }

  STATE.log.push({date: new Date().toISOString(), action: 'forense_activated', courts: alertCourts.length});
  STATE.saved = today();
  render();
  scheduleSave();
  showToast('\u{1F52C} Forense activado — ' + alertCourts.length + ' escritos pendientes de redactar');
}

const SYNC_CAT_ORDER = ["penal","contadmin","social","civil","tc","cgpj","familia","rpatrimonial","tributario","expediente","decanato","pendiente"];
const SYNC_STATUS_MAP = {"curso":"En curso","espera":"Esperando respuesta","juicio":"Preparar juicio","actuar":"Actuación pendiente","resuelto":"Resuelto","ganado":"Ganado","perdido":"Perdido"};

let syncInProgress = false;
async function syncToSheets(silent){
  if(syncInProgress) return;
  syncInProgress = true;
  const statusEl = document.getElementById("sync-status");
  try {
    const mcp = await window.claude?.use?.("mcp");
    if(!mcp){
      // Fuera del Artifact (p. ej. GitHub Pages) no hay puente MCP: la escritura
      // al Sheet es imposible. Antes se abandonaba en silencio y el botón parecía roto.
      if(!silent){
        if(statusEl) statusEl.textContent = "\u26A0\uFE0F Sync no disponible aquí";
        showToast("\u26A0\uFE0F Escritura al Sheet solo disponible en el Artifact de Claude");
      }
      syncInProgress = false; return;
    }
    if(statusEl) statusEl.textContent = "⏳ Sincronizando...";

    // Build rows: header + grouped cases with separator rows
    const hdr = ["ID","Jurisdicción","Tema / Actuación","Órgano","Referencia / nº","REGAGE / Registro","Fecha actuación","Cuantía €","Tipo tarea","Estado","Fecha límite dura","Días para límite","ALERTA","Deriva a →","Notas"];
    const allRows = [hdr];

    for(const cat of SYNC_CAT_ORDER){
      const cc = STATE.cases.filter(c=>c.cat===cat);
      if(!cc.length) continue;
      allRows.push(Array(15).fill(""));
      for(const c of cc){
        const lastStep = c.steps && c.steps.length ? c.steps[c.steps.length-1] : null;
        const lastDate = lastStep ? lastStep.d : "";
        let regage = "";
        if(c.steps) for(const s of c.steps){ const m = String(s.t||"").match(/REGAGE\w+/i); if(m) regage = m[0]; }
        let deadline = c.nextDate || c.trial || "";
        let daysLeft = "";
        if(deadline){
          try { const dl = new Date(deadline); const now = new Date(); daysLeft = String(Math.ceil((dl - now)/(1000*60*60*24))); } catch(e){}
        }
        let deadlineStr = "";
        if(deadline){ try { const d = new Date(deadline); deadlineStr = d.toLocaleDateString("es-ES"); } catch(e){ deadlineStr = deadline; } }

        allRows.push([
          c.id,
          SYNC_CAT_LABELS[c.cat] || c.cat.toUpperCase(),
          c.name || "",
          c.court || "",
          c.ref || "",
          regage,
          lastDate,
          c.amount ? String(c.amount) : "",
          SYNC_NEXT_MAP[c.nextType] || c.nextType || "—",
          SYNC_STATUS_MAP[c.status] || c.status || "",
          deadlineStr,
          daysLeft,
          SYNC_URGENCY_MAP[c.urgency] || "",
          "",
          c.current || ""
        ]);
      }
    }

    // Pad to at least 65 rows to clear old data
    while(allRows.length < 65) allRows.push(Array(15).fill(""));

    const range = "PANEL!A1:O" + allRows.length;
    const body = JSON.stringify({ values: allRows });

    await mcp.callTool("Zapier", "execute_zapier_write_action", {
      selected_api: "GoogleSheetsV2CLIAPI",
      action: "_zap_raw_request",
      tool_name: "google_sheets_make_api_mutating_request",
      params: {
        method: "PUT",
        url: SHEET_API + "/values/" + encodeURIComponent(range),
        querystring: { valueInputOption: "USER_ENTERED" },
        headers: { "Content-Type": "application/json" },
        body: body,
        fail_on_errors: "true"
      }
    });

    // Also update HOY sheet with summary
    const today = new Date().toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit",year:"numeric"});
    const hoyRows = [
      ["Pizarra Juridico — Resumen " + today, "", "", ""],
      ["Total casos", String(STATE.cases.length), "Cuantía total", STATE.cases.reduce((s,c)=>s+(c.amount||0),0).toLocaleString("es-ES")+"€"],
      ["Urgentes (🔴)", String(STATE.cases.filter(c=>c.urgency==="red").length), "Próximos (🟠)", String(STATE.cases.filter(c=>c.urgency==="orange").length)],
      ["En espera (🟡)", String(STATE.cases.filter(c=>c.urgency==="yellow"||c.status==="espera").length), "Resueltos (✅)", String(STATE.cases.filter(c=>c.urgency==="green"||c.status==="resuelto"||c.status==="ganado").length)],
      ["","","",""],
      ["⚠️ PRÓXIMAS FECHAS LÍMITE","","",""],
    ];
    const deadlineCases = STATE.cases.filter(c=>(c.nextDate||c.trial)&&c.status!=="resuelto"&&c.status!=="ganado").sort((a,b)=>{
      const da = new Date(a.nextDate||a.trial||"2099-01-01");
      const db = new Date(b.nextDate||b.trial||"2099-01-01");
      return da-db;
    }).slice(0,10);
    for(const c of deadlineCases){
      const dl = c.nextDate||c.trial;
      let dlStr = ""; try { dlStr = new Date(dl).toLocaleDateString("es-ES"); } catch(e){ dlStr = dl; }
      hoyRows.push([c.name, c.court||"", dlStr, c.current||""]);
    }
    while(hoyRows.length < 20) hoyRows.push(["","","",""]);

    await mcp.callTool("Zapier", "execute_zapier_write_action", {
      selected_api: "GoogleSheetsV2CLIAPI",
      action: "_zap_raw_request",
      tool_name: "google_sheets_make_api_mutating_request",
      params: {
        method: "PUT",
        url: SHEET_API + "/values/" + encodeURIComponent("HOY!A1:D"+hoyRows.length),
        querystring: { valueInputOption: "USER_ENTERED" },
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ values: hoyRows }),
        fail_on_errors: "true"
      }
    });

    STATE.lastSync = new Date().toISOString();
    if(statusEl) statusEl.textContent = "✅ Sheet " + new Date().toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"});
    showToast("📤 Google Sheet actualizado");
  } catch(e){
    console.warn("Sync failed:", e);
    if(statusEl) statusEl.textContent = "❌ Error sync";
    showToast("❌ Error sincronizando Sheet");
  }
  syncInProgress = false;
}

// RESPALDO: URL antigua de "Publicar en la Web", por si gviz fallara.

const SYNC_NEXT_MAP_REV = Object.fromEntries(Object.entries(SYNC_NEXT_MAP).map(([k,v])=>[normLabel(v),k]));
const SYNC_STATUS_MAP_REV = Object.fromEntries(Object.entries(SYNC_STATUS_MAP).map(([k,v])=>[normLabel(v),k]));
const SYNC_URGENCY_MAP_REV = Object.fromEntries(Object.entries(SYNC_URGENCY_MAP).map(([k,v])=>[normLabel(v.replace(/^\S+\s*/,"")),k]));
const CAT_LABEL_TO_KEY = (()=>{
  const m = {};
  for(const k of Object.keys(CATS)) m[normLabel(CATS[k].label)] = k;
  for(const k of Object.keys(SYNC_CAT_LABELS)) if(!(normLabel(SYNC_CAT_LABELS[k]) in m)) m[normLabel(SYNC_CAT_LABELS[k])] = k;
  return m;
})();

function normLabel(s){ return String(s||"").toUpperCase().trim().replace(/\s*\/\s*/g,"/").replace(/\s+/g," "); }

function catKeyFromLabel(label){
  const n = normLabel(label);
  if(CAT_LABEL_TO_KEY[n]) return CAT_LABEL_TO_KEY[n];
  // coincidencia parcial (p.ej. "TRIBUTARIO" ⊂ "TRIBUTARIO/INSS")
  for(const key of Object.keys(CAT_LABEL_TO_KEY)){
    if(n && (key.includes(n) || n.includes(key))) return CAT_LABEL_TO_KEY[key];
  }
  return "pendiente";
}

function parseSheetDate(s){
  s = String(s||"").trim();
  if(!s) return null;
  // dd/mm/yyyy o dd-mm-yyyy
  let m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if(m){
    let [,d,mo,y] = m;
    if(y.length===2) y = "20"+y;
    return y+"-"+mo.padStart(2,"0")+"-"+d.padStart(2,"0");
  }
  // ya viene en ISO
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  return null;
}

function parseCSV(text){
  const rows = []; let row = []; let field = ""; let inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field = ""; }
      else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ""; }
      else if(c === '\r'){ /* skip, \n handles line break */ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}

// ─── Diagnóstico permanente de lectura de Sheet ─────────────────────────────
// Escribe en #sheet-diag (div inyectado por render()) el resultado exacto:
// URL intentada, filas recibidas, IDs creados, o el error literal.
// NO usa toast (desaparece en 2.5 s y el usuario no lo ve).
function _diagSheet(html, ok){
  const el = document.getElementById("sheet-diag");
  if(!el) return;
  el.innerHTML = html;
  el.style.color = ok ? "var(--ok,#4caf50)" : "var(--urgent,#e53935)";
  el.style.fontWeight = ok ? "normal" : "bold";
}

async function loadFromSheet(){
  const statusEl = document.getElementById("sync-status");
  let urlUsed = "(sin intentar)";
  try {
    if(statusEl) statusEl.textContent = "⬇️ Leyendo Sheet…";
    _diagSheet("⏳ Conectando con Google Sheets…", true);

    // Lectura en vivo: gviz (no-cache por cabeceras de Google) como primaria,
    // "Publicar en la Web" como respaldo. Doble protección anti-caché.
    let csvText = null, lastErr = null, lastStatus = null;
    for(const base of [SHEET_CSV_URL, SHEET_CSV_URL_FALLBACK]){
      urlUsed = base.slice(0, 80);
      try {
        const resp = await fetch(base + "&_=" + Date.now(), {
          cache: "no-store",
          headers: { "Cache-Control": "no-cache, no-store" }
        });
        lastStatus = resp.status;
        if(!resp.ok) throw new Error("HTTP " + resp.status + " " + resp.statusText);
        csvText = await resp.text();
        break;
      } catch(err){
        lastErr = err;
        _diagSheet("⚠️ URL1 falló: " + err.message + " — probando respaldo…", false);
      }
    }
    if(csvText === null){
      const errMsg = (lastErr ? lastErr.message : "sin respuesta") +
        (lastStatus ? " (HTTP " + lastStatus + ")" : " (red/CORS sin respuesta)");
      throw new Error(errMsg);
    }

    const rows = parseCSV(csvText).filter(r => r.some(cell => String(cell||"").trim() !== ""));
    if(rows.length < 2){
      _diagSheet("⚠️ Sheet vacío — 0 filas de datos recibidas", false);
      if(statusEl) statusEl.textContent = "⚠️ Sheet vacío";
      return;
    }

    // COLUMNAS PANEL: A=ID B=Jurisdicción C=Tema D=Órgano E=Referencia F=REGAGE
    // G=Fecha actuación H=Cuantía I=Tipo tarea J=Estado K=Fecha límite L=Días límite
    // M=ALERTA N=Deriva a O=Notas
    let updated = 0, created = 0;
    const newIds = [];
    for(let i=1;i<rows.length;i++){
      const r = rows[i];
      const sheetId = String(r[0]||"").trim(); // columna A — identificador estable
      const ref = String(r[4]||"").trim();     // columna E
      if(!sheetId && !ref) continue; // sin ID ni Referencia no se puede fusionar ni crear

      const jurisdiccion = String(r[1]||"").trim();
      const tema = String(r[2]||"").trim();
      const organo = String(r[3]||"").trim();
      const cuantiaRaw = String(r[7]||"").trim();
      const tipoTarea = String(r[8]||"").trim();
      const estado = String(r[9]||"").trim();
      const fechaLimite = String(r[10]||"").trim();
      const notas = String(r[14]||"").trim();

      let amount = null;
      if(cuantiaRaw){
        const amt = parseInt(cuantiaRaw.replace(/[^0-9]/g,""));
        // Antes: if(amt > 0) — descartaba una cuantía legítima de 0 €.
        // Se guarda también isNaN: "€" o "-" limpian a "" y parseInt("") da NaN.
        if(cuantiaRaw !== "" && !isNaN(amt)) amount = amt;
      }
      const nextDate = parseSheetDate(fechaLimite);
      const statusKey = SYNC_STATUS_MAP_REV[normLabel(estado)];
      const nextTypeKey = SYNC_NEXT_MAP_REV[normLabel(tipoTarea)];

      // Fusión por ID de columna A (estable); si no hay, por Referencia de columna E.
      const existing =
        (sheetId && STATE.cases.find(cs => String(cs.id||"").trim() === sheetId)) ||
        (ref && STATE.cases.find(cs => normLabel(cs.ref) === normLabel(ref))) || null;

      if(existing){
        // Fusión: solo se sobrescriben campos con dato no vacío en el Sheet
        if(organo) existing.court = organo;
        if(tema) existing.name = tema;
        if(amount !== null) existing.amount = amount;
        if(statusKey) existing.status = statusKey;
        if(nextTypeKey) existing.nextType = nextTypeKey;
        if(nextDate) existing.nextDate = nextDate;
        if(notas) existing.current = notas;
        if(jurisdiccion) existing.cat = catKeyFromLabel(jurisdiccion);
        updated++;
      } else {
        // No existe tarjeta con esa Referencia → se crea una nueva
        const newId = sheetId || ("sh" + Date.now().toString(36) + Math.random().toString(36).slice(2,6));
        newIds.push(newId);
        STATE.cases.push({
          id: newId,
          cat: catKeyFromLabel(jurisdiccion),
          name: tema || ref || sheetId,
          ref: ref,
          court: organo || "",
          amount: amount || 0,
          trial: null,
          priority: 3,
          status: statusKey || "curso",
          current: notas || "",
          nextType: nextTypeKey || "revisar",
          nextDate: nextDate,
          steps: [],
          urgency: "yellow",
          ganado: 0
        });
        created++;
      }
    }

    const civilCount = STATE.cases.filter(c=>c.cat==="civil").length;
    const diagOk = "✅ " + updated + " actualizadas, " + created + " nuevas" +
      " | total: " + STATE.cases.length + " | CIVIL: " + civilCount +
      (newIds.length ? " | creadas: [" + newIds.join(", ") + "]" : "") +
      " | " + new Date().toLocaleTimeString("es-ES");
    if(statusEl) statusEl.textContent = "✅ " + updated + "↑ " + created + "+";
    render(); scheduleSave();
    _diagSheet(diagOk, true); // DESPUÉS de render() para que el div recién creado exista
  } catch(e){
    const errDetail = (e && e.message) ? e.message : String(e);
    _diagSheet("❌ LOAD FALLÓ — " + errDetail +
      " | URL: " + urlUsed +
      " | " + new Date().toLocaleTimeString("es-ES"), false);
    if(statusEl) statusEl.textContent = "❌ Error";
    console.error("loadFromSheet:", errDetail, "url:", urlUsed);
  }
}

      <input id="nc-tipotarea" type="text" placeholder="escrito, vista, plazo…">
    </div>
    <div class="nc-field">
      <label>Fecha límite (DD/MM/AAAA)</label>
      <input id="nc-fechalimite" type="text" placeholder="30/09/2026">
    </div>
  </div>
  <div class="nc-field">
    <label>Notas</label>
    <textarea id="nc-notas" placeholder="Observaciones adicionales…"></textarea>
  </div>
  <div id="nc-result"></div>
  <div class="nc-btns">
    <button class="nc-btn-cancel" onclick="closeNuevoCaso()">Cancelar</button>
    <button class="nc-btn-submit" id="nc-submit" onclick="submitNuevoCaso()">Crear caso</button>
  </div>
</div>`;
  document.body.appendChild(overlay);

  // Cerrar al hacer clic en el fondo
  overlay.addEventListener("click", function(e){
    if(e.target === overlay) closeNuevoCaso();
  });
  // Cerrar con Escape
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape" && overlay.classList.contains("open")) closeNuevoCaso();
  });
})();

function openNuevoCaso(){
  const ov = document.getElementById("nc-overlay");
  if(!ov) return;
  // Limpiar estado anterior
  ["nc-juris","nc-tema","nc-organo","nc-ref","nc-fecha","nc-cuantia","nc-tipotarea","nc-fechalimite","nc-notas"]
    .forEach(id => { const el = document.getElementById(id); if(el) el.value = ""; });
  const res = document.getElementById("nc-result");
  if(res){ res.className=""; res.style.display="none"; res.textContent=""; }
  const btn = document.getElementById("nc-submit");
  if(btn){ btn.disabled = false; btn.textContent = "Crear caso"; }
  ov.classList.add("open");
  const first = document.getElementById("nc-juris");
  if(first) setTimeout(()=>first.focus(), 60);
}

function closeNuevoCaso(){
  const ov = document.getElementById("nc-overlay");
  if(ov) ov.classList.remove("open");
}

async function submitNuevoCaso(){
  const get = id => { const el = document.getElementById(id); return el ? el.value.trim() : ""; };
  const juris = get("nc-juris");
  const tema  = get("nc-tema");
  const fecha = get("nc-fecha");

  const res = document.getElementById("nc-result");
  function showRes(msg, ok){
    res.textContent = msg;
    res.className = ok ? "ok" : "err";
    res.style.display = "block";
  }

  if(!juris){ showRes("⚠️ Selecciona una jurisdicción.", false); return; }
  if(!tema)  { showRes("⚠️ El campo Tema/Actuación es obligatorio.", false); return; }
  if(!fecha) { showRes("⚠️ La fecha de actuación es obligatoria.", false); return; }

  const btn = document.getElementById("nc-submit");
  btn.disabled = true;
  btn.textContent = "Enviando…";
  showRes("⏳ Conectando con la Sheet…", true);

  const body = {
    token          : WEBAPP_TOKEN,
    jurisdiccion   : juris,
    tema           : tema,
    organo         : get("nc-organo"),
    referencia     : get("nc-ref"),
    fechaActuacion : fecha,
    cuantia        : get("nc-cuantia"),
    tipoTarea      : get("nc-tipotarea"),
    fechaLimite    : get("nc-fechalimite"),
    notas          : get("nc-notas")
  };

  try {
    const resp = await fetch(WEBAPP_URL, {
      method  : "POST",
      headers : { "Content-Type": "application/json" },
      body    : JSON.stringify(body)
    });
    const data = await resp.json();
    if(data.success){
      showRes("✅ Caso creado con ID: " + data.id + " — recargando pizarra…", true);
      btn.textContent = "✅ Creado";
      // Recargar desde Sheet para que el caso aparezca sin refrescar la página
      setTimeout(async ()=>{
        await loadFromSheet();
        closeNuevoCaso();
      }, 1200);
    } else {
      showRes("❌ Error del servidor: " + (data.error || "respuesta vacía"), false);
      btn.disabled = false;
      btn.textContent = "Crear caso";
    }
  } catch(e){
    showRes("❌ Error de red: " + (e.message || String(e)), false);
    btn.disabled = false;
    btn.textContent = "Crear caso";
  }
}
</script>
