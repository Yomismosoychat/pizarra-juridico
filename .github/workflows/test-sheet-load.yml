name: Test Sheet Load & Form Submit

on:
  push:
    branches: ['claude/pizarra-juridico-sheets-4jcjoc', 'claude/compact-mode-rbttdt']
  workflow_dispatch:

jobs:
  # ── TEST 1: Sheet loads correctly, CIVIL count = 7 ─────────────────────────
  test-civil-count:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install http-server and Playwright
        run: |
          npm install -g http-server
          npm install playwright@latest
          npx playwright install chromium --with-deps

      - name: Serve index.html and run Playwright test
        run: |
          # Start static file server in background
          http-server . -p 8787 --cors &
          HTTP_PID=$!
          sleep 2
          echo "http-server PID: $HTTP_PID"

          # Run Playwright script
          node - <<'PLAYWRIGHT_EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });
            const page = await browser.newPage();

            // Capture all console output
            const logs = [];
            page.on('console', msg => {
              const entry = `[${msg.type().toUpperCase()}] ${msg.text()}`;
              logs.push(entry);
              console.log('BROWSER:', entry);
            });
            page.on('pageerror', err => {
              const entry = `[PAGEERROR] ${err.message}`;
              logs.push(entry);
              console.log('BROWSER:', entry);
            });

            // Open the local page (real internet for fetch to Google Sheets)
            console.log('Opening page...');
            await page.goto('http://localhost:8787/index.html', {
              waitUntil: 'domcontentloaded',
              timeout: 30000
            });

            // Wait for loadFromSheet() to complete (max 25s)
            console.log('Waiting for Sheet load to complete...');
            let diagText = '';
            try {
              await page.waitForFunction(() => {
                const el = document.getElementById('sheet-diag');
                if (!el) return false;
                const t = el.textContent || '';
                return t.startsWith('✅') || t.startsWith('❌') || t.startsWith('⚠️');
              }, { timeout: 25000 });
              diagText = await page.$eval('#sheet-diag', el => el.textContent || '');
            } catch (e) {
              diagText = await page.$eval('#sheet-diag', el => el.textContent || '').catch(() => '(not found)');
              console.log('Timeout waiting for sheet-diag. Current text:', diagText);
            }

            console.log('');
            console.log('=== SHEET-DIAG ===');
            console.log(diagText);
            console.log('==================');

            // Get full page text for debugging
            const bodyText = await page.evaluate(() => document.body.innerText);
            const civilMatch = bodyText.match(/CIVIL[^\n]*\n[\s\S]{0,500}/i);
            console.log('');
            console.log('=== CIVIL SECTION (body text) ===');
            console.log(civilMatch ? civilMatch[0].slice(0, 400) : '(not found)');
            console.log('=================================');

            // Extract CIVIL count from diag
            const diagCivilMatch = diagText.match(/CIVIL:\s*(\d+)/);
            const diagCivilCount = diagCivilMatch ? parseInt(diagCivilMatch[1]) : null;
            console.log('CIVIL count from sheet-diag:', diagCivilCount);

            // Fallback: extract from body text pattern "CIVIL\n7"
            let bodyCivilCount = null;
            try {
              const bodyMatch = bodyText.match(/CIVIL\s*\n\s*(\d+)/i);
              if (bodyMatch) bodyCivilCount = parseInt(bodyMatch[1]);
            } catch(_) {}
            console.log('CIVIL count from body text:', bodyCivilCount);

            const finalCivilCount = diagCivilCount !== null ? diagCivilCount : bodyCivilCount;
            console.log('CIVIL count (authoritative):', finalCivilCount);

            await browser.close();

            const EXPECTED_CIVIL = 7;
            if (finalCivilCount === null) {
              console.error('FAIL: Could not determine CIVIL count.');
              console.error('sheet-diag says:', diagText);
              process.exit(1);
            }
            if (finalCivilCount !== EXPECTED_CIVIL) {
              console.error(`FAIL: Expected CIVIL=${EXPECTED_CIVIL}, got CIVIL=${finalCivilCount}`);
              console.error('sheet-diag:', diagText);
              process.exit(1);
            }
            console.log('');
            console.log(`PASS: CIVIL=${finalCivilCount} as expected.`);
          })();
          PLAYWRIGHT_EOF

          # Cleanup
          kill $HTTP_PID 2>/dev/null || true

  # ── TEST 2: Form submit → new row in Sheet ─────────────────────────────────
  test-form-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test-civil-count

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install http-server and Playwright
        run: |
          npm install -g http-server
          npm install playwright@latest
          npx playwright install chromium --with-deps

      - name: Form submit test (real Web App + gviz verification)
        run: |
          http-server . -p 8787 --cors &
          HTTP_PID=$!
          sleep 2
          echo "http-server PID: $HTTP_PID"

          node - <<'PLAYWRIGHT_EOF'
          const { chromium } = require('playwright');

          const SHEET_ID  = '15W3aYgk2m6kqKlbl8TNcB2V38-QmFusaFwrm9gUlzts';
          const SHEET_GID = '953772179';
          const GVIZ_URL  = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${SHEET_GID}`;

          // Today's date in DD/MM/YYYY (Spain format)
          const today = new Date();
          const fechaHoy = `${String(today.getDate()).padStart(2,'0')}/${String(today.getMonth()+1).padStart(2,'0')}/${today.getFullYear()}`;
          const temaTest = `Playwright-test-${Date.now()}`;

          console.log(`Test date: ${fechaHoy}`);
          console.log(`Test tema: ${temaTest}`);

          (async () => {
            // ── Step 0: Read gviz CSV before submit (to get baseline total) ──
            console.log('');
            console.log('=== Step 0: Fetching gviz CSV (baseline) ===');
            let csvBefore = '';
            try {
              const r = await fetch(GVIZ_URL);
              csvBefore = await r.text();
              const rowsBefore = csvBefore.trim().split('\n').filter(l => l.trim()).length - 1; // minus header
              console.log(`Baseline: ${rowsBefore} data rows in Sheet`);
            } catch(e) {
              console.log('Warning: could not fetch gviz before submit:', e.message);
            }

            // ── Step 1: Open page, wait for initial Sheet load ──
            const browser = await chromium.launch({
              headless: true,
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });
            const page = await browser.newPage();

            page.on('console', msg => console.log(`BROWSER [${msg.type().toUpperCase()}]`, msg.text()));
            page.on('pageerror', err => console.log('BROWSER [PAGEERROR]', err.message));

            console.log('');
            console.log('=== Step 1: Opening page ===');
            await page.goto('http://localhost:8787/index.html', {
              waitUntil: 'domcontentloaded',
              timeout: 30000
            });

            // Wait for initial sheet load
            console.log('Waiting for initial Sheet load...');
            let initialDiag = '';
            try {
              await page.waitForFunction(() => {
                const el = document.getElementById('sheet-diag');
                if (!el) return false;
                const t = el.textContent || '';
                return t.startsWith('✅') || t.startsWith('❌') || t.startsWith('⚠️');
              }, { timeout: 25000 });
              initialDiag = await page.$eval('#sheet-diag', el => el.textContent || '');
              console.log('Initial diag:', initialDiag.slice(0, 120));
            } catch(e) {
              console.log('Warning: timeout waiting for initial sheet-diag');
            }

            // Extract initial total from diag (format: "✅ N actualizadas, M nuevas | total: T | ...")
            let totalBefore = null;
            const totalMatch = initialDiag.match(/total:\s*(\d+)/);
            if (totalMatch) totalBefore = parseInt(totalMatch[1]);
            console.log(`Total before submit: ${totalBefore}`);

            // ── Step 2: Open modal ──
            console.log('');
            console.log('=== Step 2: Opening + Nuevo caso modal ===');
            const btnNuevo = await page.$('#btn-nuevo-caso, .nuevo-caso-btn');
            if (!btnNuevo) {
              console.error('FAIL: button #btn-nuevo-caso not found in DOM');
              await browser.close();
              process.exit(1);
            }
            await btnNuevo.click();
            await page.waitForTimeout(300);

            // Verify modal is open
            const overlayVisible = await page.$eval('#nc-overlay', el => el.classList.contains('open')).catch(() => false);
            if (!overlayVisible) {
              console.error('FAIL: #nc-overlay did not open after button click');
              await browser.close();
              process.exit(1);
            }
            console.log('Modal opened ✓');

            // ── Step 3: Fill form ──
            console.log('');
            console.log('=== Step 3: Filling form ===');

            // Jurisdicción select → PENDIENTES (avoids changing CIVIL=7 baseline)
            await page.selectOption('#nc-juris', 'PENDIENTES');
            console.log('Jurisdicción set to PENDIENTES ✓');

            // Tema (required)
            await page.fill('#nc-tema', temaTest);
            console.log(`Tema set to: ${temaTest} ✓`);

            // Fecha actuación (required)
            await page.fill('#nc-fecha', fechaHoy);
            console.log(`Fecha actuación set to: ${fechaHoy} ✓`);

            // Optional fields
            await page.fill('#nc-organo', 'Playwright CI').catch(() => {});
            await page.fill('#nc-notas', 'Automated test row — safe to delete').catch(() => {});

            // ── Step 4: Submit ──
            console.log('');
            console.log('=== Step 4: Submitting form ===');
            await page.click('#nc-submit');
            console.log('Submit clicked. Waiting for response...');

            // Wait for result div to show final success ✅ or error ❌ (not the loading spinner ⏳)
            let resultText = '';
            try {
              await page.waitForFunction(() => {
                const el = document.getElementById('nc-result');
                if (!el) return false;
                const t = el.textContent || '';
                return t.includes('✅') || t.includes('❌') || t.toLowerCase().includes('error');
              }, { timeout: 35000 });
              resultText = await page.$eval('#nc-result', el => el.textContent || '');
            } catch(e) {
              resultText = await page.$eval('#nc-result', el => el.textContent || '').catch(() => '(not found)');
              console.log('Timeout waiting for result. Current result:', resultText);
            }

            console.log('');
            console.log('=== FORM RESULT ===');
            console.log(resultText);
            console.log('===================');

            if (!resultText.includes('✅')) {
              console.error('FAIL: Form submit did not return success (✅)');
              console.error('Result was:', resultText);
              await browser.close();
              process.exit(1);
            }

            // Extract generated ID from result text
            const idMatch = resultText.match(/ID:\s*([a-z0-9\-]+)/i);
            const newId = idMatch ? idMatch[1] : null;
            console.log(`New ID returned by Web App: ${newId}`);

            if (!newId) {
              console.error('FAIL: Could not extract new ID from result:', resultText);
              await browser.close();
              process.exit(1);
            }

            // ── Step 5: Wait for loadFromSheet() to reload after 1.2s delay ──
            console.log('');
            console.log('=== Step 5: Waiting for page to reload from Sheet ===');
            // loadFromSheet() fires 1.2s after success, then closes modal
            // Wait for modal to close (nc-overlay loses .open class)
            try {
              await page.waitForFunction(() => {
                const el = document.getElementById('nc-overlay');
                return el && !el.classList.contains('open');
              }, { timeout: 10000 });
              console.log('Modal closed (loadFromSheet triggered) ✓');
            } catch(e) {
              console.log('Warning: modal did not close within 10s');
            }

            // Then wait for sheet-diag to update
            let updatedDiag = '';
            try {
              // Wait for diag to change from its initial value
              if (initialDiag) {
                await page.waitForFunction(
                  (prev) => {
                    const el = document.getElementById('sheet-diag');
                    if (!el) return false;
                    const t = el.textContent || '';
                    return (t.startsWith('✅') || t.startsWith('❌')) && t !== prev;
                  },
                  initialDiag,
                  { timeout: 25000 }
                );
              } else {
                await page.waitForFunction(() => {
                  const el = document.getElementById('sheet-diag');
                  if (!el) return false;
                  const t = el.textContent || '';
                  return t.startsWith('✅') || t.startsWith('❌');
                }, { timeout: 25000 });
              }
              updatedDiag = await page.$eval('#sheet-diag', el => el.textContent || '');
              console.log('Updated diag:', updatedDiag.slice(0, 120));
            } catch(e) {
              updatedDiag = await page.$eval('#sheet-diag', el => el.textContent || '').catch(() => '');
              console.log('Warning: timeout waiting for updated diag. Current:', updatedDiag.slice(0, 120));
            }

            await browser.close();

            // Extract updated total
            let totalAfter = null;
            const totalAfterMatch = updatedDiag.match(/total:\s*(\d+)/);
            if (totalAfterMatch) totalAfter = parseInt(totalAfterMatch[1]);
            console.log(`Total after submit: ${totalAfter}`);

            // ── Step 6: Verify total increased by 1 ──
            console.log('');
            console.log('=== Step 6: Verify total +1 ===');
            if (totalBefore !== null && totalAfter !== null) {
              if (totalAfter === totalBefore + 1) {
                console.log(`PASS: Total went from ${totalBefore} → ${totalAfter} (+1) ✓`);
              } else {
                console.error(`FAIL: Expected total ${totalBefore + 1}, got ${totalAfter}`);
                process.exit(1);
              }
            } else {
              console.log(`Warning: could not compare totals (before=${totalBefore}, after=${totalAfter}). Skipping count check.`);
            }

            // ── Step 7: Verify new ID in gviz CSV ──
            console.log('');
            console.log('=== Step 7: Verifying new ID in gviz CSV ===');
            // Wait a moment for Sheet propagation
            await new Promise(r => setTimeout(r, 3000));

            let csvAfter = '';
            let attempts = 0;
            let idFound = false;
            while (attempts < 5 && !idFound) {
              attempts++;
              try {
                const r = await fetch(GVIZ_URL + '&_=' + Date.now());
                csvAfter = await r.text();
                if (csvAfter.includes(newId)) {
                  idFound = true;
                } else {
                  console.log(`Attempt ${attempts}: ID not yet in CSV, waiting 4s...`);
                  await new Promise(r => setTimeout(r, 4000));
                }
              } catch(e) {
                console.log(`Attempt ${attempts}: gviz fetch error: ${e.message}`);
                await new Promise(r => setTimeout(r, 4000));
              }
            }

            console.log('');
            console.log('=== GVIZ CSV RESULT ===');
            console.log(`New ID searched: ${newId}`);
            console.log(`ID found in CSV: ${idFound}`);
            if (csvAfter) {
              const rowsAfter = csvAfter.trim().split('\n').filter(l => l.trim()).length - 1;
              console.log(`Total rows in Sheet after submit: ${rowsAfter}`);
            }
            console.log('=======================');

            if (!idFound) {
              console.error(`FAIL: New ID "${newId}" not found in gviz CSV after ${attempts} attempts.`);
              // Show last 3 rows of CSV for debugging
              const lines = csvAfter.trim().split('\n');
              console.error('Last 3 CSV rows:');
              lines.slice(-3).forEach(l => console.error(' ', l.slice(0, 120)));
              process.exit(1);
            }

            console.log('');
            console.log(`PASS: New ID "${newId}" confirmed in Google Sheet via gviz ✓`);
            console.log('ALL FORM SUBMIT TESTS PASSED ✓');
          })();
          PLAYWRIGHT_EOF

          # Cleanup
          kill $HTTP_PID 2>/dev/null || true

  # ── TEST 3: EXTERNOS group — create, verify subcarpeta, check EN JUEGO, delete ──
  test-externos-group:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test-form-submit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install http-server and Playwright
        run: |
          npm install -g http-server
          npm install playwright@latest
          npx playwright install chromium --with-deps

      - name: EXTERNOS test (create → verify subgroup → check cuantia → delete)
        run: |
          http-server . -p 8787 --cors &
          HTTP_PID=$!
          sleep 2
          echo "http-server PID: $HTTP_PID"

          node - <<'PLAYWRIGHT_EOF'
          const { chromium } = require('playwright');

          const SHEET_ID    = '15W3aYgk2m6kqKlbl8TNcB2V38-QmFusaFwrm9gUlzts';
          const SHEET_GID   = '953772179';
          const GVIZ_URL    = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${SHEET_GID}`;
          const WEBAPP_URL  = 'https://script.google.com/macros/s/AKfycbyxEpXi44bsdVXy0ms25x8JzQGOwFcKNEWZnCUDos4lJRs0_tmgBk_eQcdofRsFqei_/exec';
          const WEBAPP_TOKEN = 'vKPe__KvDIkkJ56R7bOQUaM7DuquoFcTS0zF9UC9Fjc';

          const TEST_PERSONA = 'PlaywrightTestPerson';
          const TEST_TEMA    = 'Consulta de prueba CI';
          const TEST_CUANTIA = '1234';
          const today = new Date();
          const fechaHoy = `${String(today.getDate()).padStart(2,'0')}/${String(today.getMonth()+1).padStart(2,'0')}/${today.getFullYear()}`;

          (async () => {
            const browser = await chromium.launch({ headless: true, args: ['--no-sandbox','--disable-setuid-sandbox'] });
            const page = await browser.newPage();
            page.on('console', msg => console.log(`BROWSER [${msg.type().toUpperCase()}]`, msg.text()));
            page.on('pageerror', err => console.log('BROWSER [PAGEERROR]', err.message));

            // ── Step 1: Open page, wait for initial load ──
            console.log('=== Step 1: Opening page ===');
            await page.goto('http://localhost:8787/index.html', { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForFunction(() => {
              const el = document.getElementById('sheet-diag');
              if (!el) return false;
              const t = el.textContent || '';
              return t.startsWith('✅') || t.startsWith('❌') || t.startsWith('⚠️');
            }, { timeout: 30000 });
            const diagInit = await page.$eval('#sheet-diag', el => el.textContent || '');
            console.log('Initial diag:', diagInit.slice(0, 120));

            const totalInitMatch = diagInit.match(/total:\s*(\d+)/);
            const totalInit = totalInitMatch ? parseInt(totalInitMatch[1]) : null;
            console.log('Initial total:', totalInit);

            // ── Step 2: Open modal, select EXTERNOS ──
            console.log('=== Step 2: Opening modal → EXTERNOS ===');
            const btnNuevo = await page.$('#btn-nuevo-caso, .nuevo-caso-btn');
            if (!btnNuevo) { console.error('FAIL: #btn-nuevo-caso not found'); await browser.close(); process.exit(1); }
            await btnNuevo.click();
            await page.waitForTimeout(400);

            const overlayOpen = await page.$eval('#nc-overlay', el => el.classList.contains('open')).catch(() => false);
            if (!overlayOpen) { console.error('FAIL: Modal did not open'); await browser.close(); process.exit(1); }
            console.log('Modal opened ✓');

            // Select EXTERNOS destination
            await page.selectOption('#nc-destino', 'externos');
            await page.waitForTimeout(200);

            // Verify persona field is visible, juris field is hidden
            const personaVisible = await page.$eval('#nc-persona-wrap', el => el.style.display !== 'none').catch(() => false);
            const jurisHidden    = await page.$eval('#nc-juris-wrap',   el => el.style.display === 'none').catch(() => false);
            console.log('Persona field visible:', personaVisible, '| Juris hidden:', jurisHidden);
            if (!personaVisible) { console.error('FAIL: #nc-persona-wrap not visible after EXTERNOS selection'); await browser.close(); process.exit(1); }

            // ── Step 3: Fill form ──
            console.log('=== Step 3: Filling EXTERNOS form ===');
            await page.fill('#nc-persona', TEST_PERSONA);
            await page.fill('#nc-tema', TEST_TEMA);
            await page.fill('#nc-fecha', fechaHoy);
            await page.fill('#nc-cuantia', TEST_CUANTIA);
            console.log(`Persona: ${TEST_PERSONA} | Tema: ${TEST_TEMA} | Cuantía: ${TEST_CUANTIA} ✓`);

            // ── Step 4: Submit ──
            console.log('=== Step 4: Submitting ===');
            await page.click('#nc-submit');
            await page.waitForFunction(() => {
              const el = document.getElementById('nc-result');
              if (!el) return false;
              const t = el.textContent || '';
              return t.includes('✅') || t.includes('❌') || t.toLowerCase().includes('error');
            }, { timeout: 35000 });
            const resultText = await page.$eval('#nc-result', el => el.textContent || '');
            console.log('Form result:', resultText);

            if (!resultText.includes('✅')) {
              console.error('FAIL: Form did not return success:', resultText);
              await browser.close();
              process.exit(1);
            }

            const idMatch = resultText.match(/ID:\s*([a-z0-9\-]+)/i);
            const newId = idMatch ? idMatch[1] : null;
            console.log('New ID:', newId);
            if (!newId) { console.error('FAIL: Could not extract ID from result:', resultText); await browser.close(); process.exit(1); }

            // ── Step 5: Wait for auto-reload ──
            console.log('=== Step 5: Waiting for auto-reload ===');
            try {
              await page.waitForFunction(() => {
                const el = document.getElementById('nc-overlay');
                return el && !el.classList.contains('open');
              }, { timeout: 12000 });
              console.log('Modal closed ✓');
            } catch(e) { console.log('Warning: modal did not close within 12s'); }

            let updatedDiag = '';
            try {
              await page.waitForFunction(
                (prev) => {
                  const el = document.getElementById('sheet-diag');
                  if (!el) return false;
                  const t = el.textContent || '';
                  return (t.startsWith('✅') || t.startsWith('❌')) && t !== prev;
                },
                diagInit,
                { timeout: 30000 }
              );
              updatedDiag = await page.$eval('#sheet-diag', el => el.textContent || '');
              console.log('Updated diag:', updatedDiag.slice(0, 120));
            } catch(e) {
              updatedDiag = await page.$eval('#sheet-diag', el => el.textContent || '').catch(() => '');
              console.log('Warning: diag timeout. Current:', updatedDiag.slice(0, 120));
            }

            // ── Step 6: Verify EXTERNOS group renders with sub-carpeta ──
            console.log('=== Step 6: Verify EXTERNOS subgroup in DOM ===');
            const bodyText = await page.evaluate(() => document.body.innerText);
            const externosSection = bodyText.match(/EXTERNOS[\s\S]{0,800}/i);
            console.log('EXTERNOS section:', externosSection ? externosSection[0].slice(0, 400) : '(not found)');

            // Check subgroup header with TEST_PERSONA
            const subgroupFound = await page.$$eval('.ext-subgroup-hdr', els =>
              els.some(el => el.textContent.includes('PlaywrightTestPerson'))
            ).catch(() => false);
            console.log('Subgroup header with persona found:', subgroupFound);
            if (!subgroupFound) {
              console.error('FAIL: EXTERNOS subgroup header for PlaywrightTestPerson not found in DOM');
              await browser.close();
              process.exit(1);
            }
            console.log('PASS: EXTERNOS subcarpeta rendered correctly ✓');

            // ── Step 7: Verify total +1 ──
            console.log('=== Step 7: Verify total +1 ===');
            const totalAfterMatch = updatedDiag.match(/total:\s*(\d+)/);
            const totalAfter = totalAfterMatch ? parseInt(totalAfterMatch[1]) : null;
            console.log(`Total before: ${totalInit}, after: ${totalAfter}`);
            if (totalInit !== null && totalAfter !== null) {
              if (totalAfter === totalInit + 1) {
                console.log('PASS: Total +1 ✓');
              } else {
                console.error(`FAIL: Expected total ${totalInit + 1}, got ${totalAfter}`);
                await browser.close();
                process.exit(1);
              }
            } else {
              console.log('Warning: could not compare totals, skipping count check');
            }

            await browser.close();

            // ── Step 8: Verify ID in gviz CSV ──
            console.log('=== Step 8: Verify ID in gviz CSV ===');
            await new Promise(r => setTimeout(r, 3000));
            let csvAfter = '';
            let idFound = false;
            for (let i = 0; i < 5 && !idFound; i++) {
              try {
                const r = await fetch(GVIZ_URL + '&_=' + Date.now());
                csvAfter = await r.text();
                if (csvAfter.includes(newId)) { idFound = true; }
                else { console.log(`Attempt ${i+1}: ID not yet in CSV, waiting 4s...`); await new Promise(r => setTimeout(r, 4000)); }
              } catch(e) { console.log(`Attempt ${i+1}: gviz error: ${e.message}`); await new Promise(r => setTimeout(r, 4000)); }
            }
            if (!idFound) { console.error(`FAIL: ID "${newId}" not found in gviz CSV`); process.exit(1); }
            console.log(`PASS: ID "${newId}" confirmed in Sheet via gviz ✓`);

            // Also verify cuantía in the CSV row
            const csvLines = csvAfter.split('\n');
            const ourRow = csvLines.find(l => l.includes(newId));
            console.log('Our CSV row:', ourRow ? ourRow.slice(0, 200) : '(not found)');
            if (ourRow && ourRow.includes(TEST_CUANTIA)) {
              console.log(`PASS: Cuantía ${TEST_CUANTIA} confirmed in CSV row ✓`);
            } else {
              console.log(`Warning: cuantía ${TEST_CUANTIA} not clearly visible in CSV row`);
            }

            // ── Step 9: DELETE test row via Web App ──
            console.log('=== Step 9: Deleting test row ===');
            try {
              const delResp = await fetch(WEBAPP_URL, {
                method: 'POST',
                body: JSON.stringify({ token: WEBAPP_TOKEN, action: 'delete', id: newId })
              });
              const delData = await delResp.json();
              console.log('Delete response:', JSON.stringify(delData));
              if (delData.success && delData.deleted) {
                console.log(`PASS: Test row "${newId}" deleted ✓`);
              } else if (delData.success) {
                console.log(`Warning: delete returned success but deleted=false (row may not have been found)`);
              } else {
                console.log(`Warning: delete failed: ${delData.error}`);
              }
            } catch(e) {
              console.log(`Warning: could not delete test row: ${e.message}`);
            }

            console.log('');
            console.log('ALL EXTERNOS TESTS PASSED ✓');
          })();
          PLAYWRIGHT_EOF

          # Cleanup
          kill $HTTP_PID 2>/dev/null || true
